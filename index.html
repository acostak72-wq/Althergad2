    <!-- ============================================================
         AETHELGARD FRAMEWORK (SDK digital integrado, sin dependencias)
         Expone window.Aethelgard: todo lo que el dashboard (o cualquier
         otra página/agente) necesita para hablar con el backend y pagar
         con Solflare. Va dentro de este mismo HTML a propósito.
         ============================================================ -->
    <script>
    window.Aethelgard = (() => {
        const RPC = "https://api.mainnet-beta.solana.com";
        const cfg = { backendUrl: "", wallet: null };

        const setBackend = (url) => { cfg.backendUrl = (url || "").replace(/\/+$/, ""); };
        const solflare = () => (window.solflare && window.solflare.isSolflare ? window.solflare : null);

        // Conecta Solflare (única wallet soportada).
        async function connectWallet() {
            const p = solflare();
            if (!p) throw new Error("Solflare no detectada. Instálala en solflare.com");
            const r = await p.connect();
            cfg.wallet = (r?.publicKey || p.publicKey).toString();
            return cfg.wallet;
        }

        // Transferencia real de SOL desde la wallet conectada.
        async function paySol(toAddress, sol) {
            const p = solflare();
            if (!p || !cfg.wallet) throw new Error("Conecta Solflare primero");
            const conn = new solanaWeb3.Connection(RPC);
            const from = new solanaWeb3.PublicKey(cfg.wallet);
            const tx = new solanaWeb3.Transaction().add(solanaWeb3.SystemProgram.transfer({
                fromPubkey: from, toPubkey: new solanaWeb3.PublicKey(toAddress), lamports: Math.round(sol * 1e9),
            }));
            tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
            tx.feePayer = from;
            const { signature } = await p.signAndSendTransaction(tx);
            await conn.confirmTransaction(signature, "confirmed");
            return signature;
        }

        // Llama a un endpoint del backend. Si responde 402 (pago requerido),
        // paga lo pedido con Solflare, espera confirmación y repite con ?tx=.
        async function call(path, { method = "GET", body, onStatus = () => {} } = {}) {
            if (!cfg.backendUrl) throw new Error("Configura la URL del backend");
            const go = (qs = "") => fetch(cfg.backendUrl + path + qs, {
                method, headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
            });
            let r = await go();
            if (r.status === 402) {
                const due = await r.json();
                if (!cfg.wallet) throw new Error(`Cuesta ~${due.montoSolAprox} SOL. Conecta Solflare para pagarlo.`);
                onStatus(`Pagando ~${due.montoSolAprox} SOL...`);
                const sig = await paySol(due.payTo, due.montoSolAprox);
                onStatus("Pago confirmado, repitiendo consulta...");
                r = await go((path.includes("?") ? "&" : "?") + "tx=" + sig);
            }
            return r.json();
        }

        return {
            setBackend, connectWallet, paySol, call,
            get wallet() { return cfg.wallet; },
            // Atajos de alto nivel
            devices:        () => call("/api/devices/registry"),
            offers:         () => call("/api/devices/offers"),
            registerDevice: (d) => call("/api/devices/register", { method: "POST", body: d }),
            publishOffer:   (o) => call("/api/devices/offer", { method: "POST", body: o }),
            negotiate:      (n, onStatus) => call("/api/energy/negotiate", { method: "POST", body: n, onStatus }),
            energyPrice:    (onStatus) => call("/api/energy/report", { onStatus }),
            catalog:        () => call("/api/datamarket/catalog"),
        };
    })();
    </script>

<script type="text/plain" id="backend-src">// ============================================================================
// AETHELGARD — Backend REAL de pagos entre agentes de IA (pago directo en Solana)
// TODO en un solo archivo (excepto package.json, que npm exige aparte).
// ============================================================================
//
// VERSIÓN SIMPLIFICADA: no usa el protocolo x402 ni Coinbase CDP. En vez de
// eso, cada endpoint pago responde con HTTP 402 y los datos para pagar
// (dirección + monto); quien quiera usarlo paga esa cantidad de SOL con
// CUALQUIER wallet (Solflare, Phantom, lo que sea) y vuelve a llamar al
// mismo endpoint agregando ?tx=<firma_de_la_transacción>. El servidor
// verifica esa transacción directo contra la blockchain (RPC público de
// Solana) antes de responder — nadie puede "inventarse" un pago.
// Ventaja: menos piezas, menos cuentas que crear, nada que dependa de un
// tercero (facilitador) para decidir si el pago es válido.
// Desventaja frente a x402/CDP: un agente de IA externo necesita que le
// digas cómo llamar tu API (no aparece listado solo en un directorio como
// Agentic.Market de Coinbase). Si más adelante quieres ese listado
// automático, se puede volver a agregar x402 encima de esto sin romper nada.
//
// QUÉ RESUELVE:
//  · M2P (agente → tu plataforma): quien use tus endpoints
//    (/api/energy/report, /api/audit/quantum...) paga en SOL real y el
//    dinero llega directo a tu wallet, verificado on-chain.
//  · M2M (agente → agente): /api/registry es un directorio (como
//    "Agent.market" de Coinbase). Cada agente pone su propio servicio y
//    su propia wallet; tu plataforma NUNCA custodia ese dinero, solo
//    indexa — así evitas necesitar licencia de operador de pagos.
//  · P2M (persona → tu plataforma): igual que M2P, solo que paga una
//    persona con su wallet en vez de un agente automatizado.
//  · Seguro mutuo autónomo y tokenización de impacto (PIVTAN) — ver
//    las secciones 4 y 5 más abajo en el propio código.
//
// IMPORTANTE: esto debe correr 24/7 en un servidor propio (Vercel, Render,
// Railway, Fly.io...). No puede vivir dentro del HTML del dashboard — un
// navegador no puede recibir pagos de otros agentes por internet.
//
// ----------------------------------------------------------------------
// VARIABLES DE ENTORNO (crea un archivo .env con esto, o ponlas en tu
// hosting — NUNCA subas claves privadas a un repositorio). La wallet de
// cobro YA viene puesta por defecto en el código (la Solflare real de
// Karen), así que solo necesitas configurar Redis para que despliegue:
//
//   SOLANA_PAYOUT_ADDRESS=          opcional — solo si algún día cambias de wallet de cobro
//   UPSTASH_REDIS_REST_URL=         Marketplace de Vercel → Upstash Redis
//   UPSTASH_REDIS_REST_TOKEN=       (se rellenan solas si usas Vercel)
//   SOLANA_RPC=                     opcional, por defecto Mainnet público (dinero real)
//   INSURANCE_TREASURY_PRIVATE_KEY= opcional — wallet SEPARADA solo para pagar reclamos de seguro
//   IMPACT_TOKEN_MINT_ADDRESS=      opcional — creado con: spl-token create-token
//   MINT_AUTHORITY_PRIVATE_KEY=     opcional — autoridad de emisión de ese mint
//   CRON_SECRET=                    opcional — protege el cron de la señal de carga
//   PORT=4021
//
// ----------------------------------------------------------------------
// 1) PROBAR LOCAL:
//      npm install
//      npm start
//      curl http://localhost:4021/api/energy/report   → debe dar 402 con instrucciones de pago
//
// 2) DESPLEGAR EN VERCEL: sube esta carpeta a GitHub → Vercel detecta
//    Express solo (Fluid Compute) → antes del Deploy, activa "Upstash
//    Redis" desde Storage → Marketplace → agrega SOLANA_PAYOUT_ADDRESS en
//    Settings → Environment Variables → Deploy.
//
// 3) SEGURO MUTUO: usa una wallet SEPARADA de tu wallet principal para
//    INSURANCE_TREASURY_PRIVATE_KEY — fondéala solo con lo que estés
//    dispuesta a arriesgar en pagos automáticos.
//
// 4) IMPACTO AMBIENTAL: el factor EMISSION_FACTOR_TCO2_PER_MWH de abajo
//    es referencial — reemplázalo por el dato oficial de la UPME antes
//    de usarlo frente a inversionistas o en un reclamo formal.
// ============================================================================

import "dotenv/config";
import express from "express";
import cors from "cors";
import { Redis } from "@upstash/redis";
import { Connection, Keypair, PublicKey, SystemProgram, Transaction, sendAndConfirmTransaction, LAMPORTS_PER_SOL } from "@solana/web3.js";
import { mintTo, burn, getOrCreateAssociatedTokenAccount } from "@solana/spl-token";
import bs58 from "bs58";
import nacl from "tweetnacl";

// ---------------------------------------------------------------------
// COBRO SIMPLE: pago directo en SOL, verificado contra la blockchain.
// Nada de facilitadores externos ni cuentas de Coinbase — solo tu wallet
// de cobro y una llamada de lectura al RPC público de Solana.
// ---------------------------------------------------------------------
async function getSolUsdPrice() {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd");
    const d = await r.json();
    return d.solana.usd;
}

// Evita que la misma transacción se reutilice para "pagar" dos veces.
async function txYaUsada(txHash) {
    const usadas = await readList("aeth:used-tx");
    return usadas.includes(txHash);
}
async function marcarTxUsada(txHash) {
    const usadas = await readList("aeth:used-tx");
    usadas.push(txHash);
    await writeList("aeth:used-tx", usadas.slice(-5000));
}

// Verifica en la red real que `txHash` transfirió al menos `minLamports` de
// SOL hacia `destino`. No confía en nada que el cliente diga — vuelve a
// consultar la transacción directo al RPC. Cada transacción solo puede usarse
// UNA vez (evita reciclar el mismo pago para varias cosas).
async function verificarTransferencia(txHash, destino, minLamports) {
    if (await txYaUsada(txHash)) return { ok: false, motivo: "Esa transacción ya se usó para pagar otra cosa." };
    const r = await fetch(SOLANA_RPC, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getTransaction", params: [txHash, { encoding: "jsonParsed", maxSupportedTransactionVersion: 0 }] }),
    });
    const d = await r.json();
    const tx = d.result;
    if (!tx || tx.meta?.err) return { ok: false, motivo: "La transacción no existe o falló on-chain (si acabas de enviarla, espera unos segundos a que se confirme)." };
    const accountKeys = (tx.transaction.message.accountKeys || []).map((k) => (typeof k === "string" ? k : k.pubkey));
    const idx = accountKeys.indexOf(destino);
    if (idx === -1) return { ok: false, motivo: `Esa transacción no le paga a ${destino}.` };
    const recibido = (tx.meta.postBalances[idx] ?? 0) - (tx.meta.preBalances[idx] ?? 0);
    if (recibido < minLamports) return { ok: false, motivo: `Se recibieron ${(recibido / LAMPORTS_PER_SOL).toFixed(6)} SOL, se necesitan ${(minLamports / LAMPORTS_PER_SOL).toFixed(6)} SOL.` };
    await marcarTxUsada(txHash);
    if (destino === SOLANA_PAYOUT) { // ingreso propio de la plataforma: llevar la cuenta real
        try {
            const px = await getSolUsdPrice().catch(() => null);
            const rev = await readList("aeth:revenue");
            rev.push({ tx: txHash, lamports: recibido, usd: px ? +((recibido / LAMPORTS_PER_SOL) * px).toFixed(6) : null, at: new Date().toISOString() });
            await writeList("aeth:revenue", rev.slice(-5000));
        } catch {}
    }
    return { ok: true, recibidoLamports: recibido };
}
const verificarPagoSol = (txHash, minLamports) => verificarTransferencia(txHash, SOLANA_PAYOUT, minLamports);

// Cobro de tarifa fija DENTRO de un handler (la versión middleware está abajo).
// Devuelve { ok:true } o { ok:false, status, body } listo para responder.
async function cobroFijo(usd, descripcion, tx) {
    if (!SOLANA_PAYOUT) return { ok: true };
    const solPrecio = await getSolUsdPrice().catch(() => null);
    if (!tx) {
        const montoSol = solPrecio ? +(usd / solPrecio).toFixed(6) : null;
        return { ok: false, status: 402, body: { error: "Pago requerido", descripcion, priceUsd: usd, payTo: SOLANA_PAYOUT, network: "solana-mainnet", montoSolAprox: montoSol, comoPagar: `Envía ~${montoSol ?? "?"} SOL (≈ $${usd}) a 'payTo' y repite la llamada con el hash de esa transacción en 'feeTx' (o ?tx=).` } };
    }
    if (!solPrecio) return { ok: false, status: 502, body: { error: "No se pudo obtener el precio de SOL para verificar el pago; reintenta." } };
    const minLamports = Math.floor((usd / solPrecio) * LAMPORTS_PER_SOL * 0.97); // 3% de margen por volatilidad
    const v = await verificarPagoSol(tx, minLamports);
    if (!v.ok) return { ok: false, status: 402, body: { error: v.motivo } };
    logPayment({ route: descripcion, tx, priceUsd: usd }).catch(() => {});
    return { ok: true };
}

// Middleware de "pared de pago" para un endpoint: si no llega ?tx=, explica
// cómo pagar (igual que un 402 de x402, pero sin su maquinaria). Si llega,
// verifica el pago real antes de dejar pasar la petición.
function requierePago(usdPrecio, descripcion) {
    return async (req, res, next) => {
        if (!SOLANA_PAYOUT) return next(); // sin wallet configurada todavía → modo pruebas, no bloquea
        const tx = req.query.tx || req.body?.tx;
        if (!tx) {
            const solPrecio = await getSolUsdPrice().catch(() => null);
            const montoSol = solPrecio ? +(usdPrecio / solPrecio).toFixed(6) : null;
            return res.status(402).json({
                error: "Pago requerido",
                descripcion,
                priceUsd: usdPrecio,
                payTo: SOLANA_PAYOUT,
                network: "solana-mainnet",
                montoSolAprox: montoSol,
                comoPagar: `Envía ~${montoSol ?? "?"} SOL (≈ $${usdPrecio}) a la dirección de 'payTo' desde cualquier wallet (Solflare, Phantom...), y repite esta misma llamada agregando ?tx=<firma_de_tu_transacción>.`,
            });
        }
        try {
            const solPrecio = await getSolUsdPrice();
            const minLamports = Math.floor((usdPrecio / solPrecio) * LAMPORTS_PER_SOL * 0.97); // 3% de margen por volatilidad del precio de SOL
            const veredicto = await verificarPagoSol(tx, minLamports);
            if (!veredicto.ok) return res.status(402).json({ error: veredicto.motivo });
            logPayment({ route: req.path, tx, priceUsd: usdPrecio }).catch(() => {});
            next();
        } catch (err) {
            res.status(502).json({ error: "No se pudo verificar el pago on-chain", detail: err.message });
        }
    };
}

async function fetchReePriceValue() {
    const now = new Date();
    const start = new Date(now.getTime() - 6 * 3600 * 1000).toISOString().slice(0, 16);
    const end = now.toISOString().slice(0, 16);
    const url = `https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${start}&end_date=${end}&time_trunc=hour`;
    const r = await fetch(url);
    const d = await r.json();
    const series = d?.included?.[0]?.attributes?.values || [];
    const last = series[series.length - 1];
    return last ? { value: last.value, timestamp: last.datetime } : null;
}

app.post("/api/devices/register", async (req, res) => {
    const { deviceId, type, connectivity, capacityKw, label, payToAddress, network, pricePerKwhUsd, acceptedPayment, parentGatewayId } = req.body || {};
    if (!deviceId || !type || !connectivity) {
        return res.status(400).json({ error: "Faltan campos: deviceId, type, connectivity. Consulta GET /api/devices/classes para ver los tipos válidos." });
    }
    if (!VALID_DEVICE_TYPES.has(type)) return res.status(400).json({ error: `type inválido. Usa uno de: ${[...VALID_DEVICE_TYPES].join(", ")}` });
    if (!VALID_CONNECTIVITY.has(connectivity)) return res.status(400).json({ error: `connectivity inválido. Usa uno de: ${[...VALID_CONNECTIVITY].join(", ")}` });
    const devices = (await readList("aeth:devices")).filter((d) => d.deviceId !== deviceId);
    const token = randomUUID().replace(/-/g, "");
    devices.push({
        deviceId, type, connectivity, capacityKw: capacityKw ?? null, label: label || deviceId, token,
        parentGatewayId: parentGatewayId || null,
        registeredAt: new Date().toISOString(), lastSeen: null,
        // Oferta de negociación real: el dueño del dispositivo cobra DIRECTO
        // a esta wallet — la plataforma nunca custodia ese dinero, solo
        // publica el anuncio (igual que el directorio de agentes M2M).
        payToAddress: payToAddress || null,
        network: network || SOLANA_NETWORK,
        pricePerKwhUsd: pricePerKwhUsd ?? null,
        acceptedPayment: Array.isArray(acceptedPayment) && acceptedPayment.length ? acceptedPayment : ["SOL", "USDC", ...(ENERGY_CREDIT_MINT ? ["ENERGY_CREDIT"] : [])],
        kwhAvailable: 0,
    });
    await writeList("aeth:devices", devices);
    // El token se devuelve UNA sola vez — el dispositivo debe guardarlo, no queda visible después.
    res.json({ ok: true, deviceId, token });
});

// El dueño del dispositivo publica/actualiza su oferta real de negociación:
// cuánta energía tiene disponible ahora mismo y a qué precio la vende.
// Autenticado con el mismo token que la telemetría — así solo el dueño
// real del dispositivo puede cambiar su propia oferta.
app.post("/api/devices/offer", async (req, res) => {
    const { deviceId, token, kwhAvailable, pricePerKwhUsd, payToAddress, network, acceptedPayment } = req.body || {};
    if (!deviceId || !token) return res.status(400).json({ error: "Faltan deviceId/token" });
    const devices = await readList("aeth:devices");
    const device = devices.find((d) => d.deviceId === deviceId);
    if (!device || device.token !== token) return res.status(401).json({ error: "Dispositivo no registrado o token inválido" });

    if (kwhAvailable !== undefined) device.kwhAvailable = Math.max(0, Number(kwhAvailable) || 0);
    if (pricePerKwhUsd !== undefined) device.pricePerKwhUsd = Number(pricePerKwhUsd) || null;
    if (payToAddress) device.payToAddress = payToAddress;
    if (network) device.network = network;
    if (Array.isArray(acceptedPayment) && acceptedPayment.length) device.acceptedPayment = acceptedPayment;
    await writeList("aeth:devices", devices);
    res.json({ ok: true, deviceId, kwhAvailable: device.kwhAvailable, pricePerKwhUsd: device.pricePerKwhUsd });
});

// Libro de ofertas abierto — lo que un agente consulta ANTES de pagar la
// tarifa de /api/energy/negotiate, y lo que /api/energy/negotiate usa para
// armar el match. Solo dispositivos con payToAddress configurado, online y
// con kwhAvailable > 0 — nada simulado: si no hay dato real reportado, no
// aparece aquí.
async function openDeviceOffers() {
    const devices = await readList("aeth:devices");
    const now = Date.now();
    return devices
        .filter((d) => d.payToAddress && d.kwhAvailable > 0 && d.lastSeen && now - new Date(d.lastSeen).getTime() < 15 * 60 * 1000)
        .sort((a, b) => (a.pricePerKwhUsd ?? Infinity) - (b.pricePerKwhUsd ?? Infinity))
        .map((d) => ({
            deviceId: d.deviceId, type: d.type, label: d.label,
            kwhAvailable: d.kwhAvailable, pricePerKwhUsd: d.pricePerKwhUsd,
            payToAddress: d.payToAddress, network: d.network, acceptedPayment: d.acceptedPayment,
        }));
}

app.get("/api/devices/offers", async (req, res) => res.json(await openDeviceOffers()));

// Telemetría. Acepta forma normal (WiFi/internet, claves largas) o forma
// COMPACTA (pensada para módems satelitales tipo Swarm, límite ~192 bytes
// por paquete): d=deviceId, k=token, p=kWh producidos, c=kWh consumidos,
// w=watts, v=voltaje. Un proveedor satelital normalmente entrega los datos
// a un webhook HTTP tuyo tras el paso del satélite — este mismo endpoint
// sirve como ese webhook, no hace falta nada especial de tu lado para eso.
// Convierte lo que mande cada marca a un formato común. Todos los campos
// son opcionales: manda solo los que tu equipo realmente mida.
//   pvW (potencia solar), loadW (consumo), gridW (+ exporta / - importa),
//   batterySoc (%), voltage, frequencyHz, tempC, kwhToday, kwhTotal,
//   kwhProduced, kwhConsumed, watts, status ('ok'|'fault'|'standby'), alarms[]
// Formato compacto satelital: d,k,p,c,w,v,b(=batterySoc),s(=status).
const num = (v) => (v === undefined || v === null || v === "" || Number.isNaN(Number(v)) ? null : Number(v));
function buildReading(device, b) {
    return {
        deviceId: device.deviceId,
        kwhProduced: num(b.kwhProduced ?? b.p),
        kwhConsumed: num(b.kwhConsumed ?? b.c),
        watts: num(b.watts ?? b.w),
        voltage: num(b.voltage ?? b.v),
        pvW: num(b.pvW),
        loadW: num(b.loadW),
        gridW: num(b.gridW),
        batterySoc: num(b.batterySoc ?? b.b),
        frequencyHz: num(b.frequencyHz),
        tempC: num(b.tempC),
        kwhToday: num(b.kwhToday),
        kwhTotal: num(b.kwhTotal),
        status: typeof (b.status ?? b.s) === "string" ? String(b.status ?? b.s).slice(0, 20) : null,
        alarms: Array.isArray(b.alarms) ? b.alarms.slice(0, 10).map((a) => String(a).slice(0, 80)) : [],
        connectivity: device.connectivity,
        at: new Date().toISOString(),
    };
}

app.post("/api/devices/telemetry", async (req, res) => {
    const body = req.body || {};
    const deviceId = body.deviceId || body.d;
    const token = body.token || body.k;
    if (!deviceId || !token) return res.status(400).json({ error: "Faltan deviceId/token (o d/k en formato compacto)" });

    const devices = await readList("aeth:devices");
    const device = devices.find((dv) => dv.deviceId === deviceId);
    if (!device || device.token !== token) return res.status(401).json({ error: "Dispositivo no registrado o token inválido" });

    const reading = buildReading(device, body);
    const readings = await readList("aeth:device-readings");
    readings.push(reading);
    await writeList("aeth:device-readings", readings.slice(-3000));

    device.lastSeen = reading.at;
    device.lastReading = reading;
    await writeList("aeth:devices", devices);
    res.json({ ok: true });
});

// Un GATEWAY / ECU / datalogger reporta varios dispositivos hijos de una sola
// vez (típico de microinversores o de un datalogger con varios inversores en
// RS485). Se autentica con SU propio token; cada hijo debe haberse registrado
// con parentGatewayId = id de este gateway, así un gateway no puede hablar por
// dispositivos ajenos.  Body: { deviceId, token, readings: [{ childId, ...campos }] }
app.post("/api/devices/telemetry/batch", async (req, res) => {
    const { deviceId, token, readings: incoming } = req.body || {};
    if (!deviceId || !token || !Array.isArray(incoming)) return res.status(400).json({ error: "Faltan deviceId, token o readings[]" });
    if (incoming.length > 100) return res.status(400).json({ error: "Máximo 100 lecturas por paquete" });

    const devices = await readList("aeth:devices");
    const gw = devices.find((d) => d.deviceId === deviceId);
    if (!gw || gw.token !== token) return res.status(401).json({ error: "Gateway no registrado o token inválido" });

    const stored = await readList("aeth:device-readings");
    const rechazados = [];
    let aceptados = 0;
    for (const item of incoming) {
        const child = devices.find((d) => d.deviceId === item.childId);
        if (!child || child.parentGatewayId !== deviceId) { rechazados.push(item.childId ?? null); continue; }
        const r = buildReading(child, item);
        stored.push(r);
        child.lastSeen = r.at;
        child.lastReading = r;
        aceptados++;
    }
    gw.lastSeen = new Date().toISOString();
    await writeList("aeth:device-readings", stored.slice(-3000));
    await writeList("aeth:devices", devices);
    res.json({ ok: true, aceptados, rechazados });
});

//    un veredicto verificado contra datos reales y firmado
//    criptográficamente, que cualquier tercero puede comprobar contra tu
//    clave pública sin tener que confiar en tu palabra tampoco.

app.post("/api/oracle/attest", requierePago(0.01, "Notario: verifica y firma una afirmación entre agentes"), async (req, res) => {
    const { claimType, claim } = req.body || {};
    let verdict = false;
    let actualValue = null;
    try {
        if (claimType === "energy_price") {
            const real = await fetchReePriceValue();
            actualValue = real?.value ?? null;
            verdict = actualValue !== null && Math.abs(actualValue - Number(claim?.claimedValue)) <= (claim?.toleranceEurMwh ?? 5);
        } else if (claimType === "ledger_settlement") {
            verdict = claim?.chain === "solana" ? await verifySolanaTx(claim.txHash, claim.network) : await verifyEvmTx(claim.txHash, claim.network);
            actualValue = verdict;
        } else if (claimType === "agent_reputation") {
            const rep = await readList("aeth:reputation");
            actualValue = rep.filter((r) => r.agentId === claim?.agentId).length;
            verdict = actualValue >= (claim?.minOps ?? 1);
        } else {
            return res.status(400).json({ error: "claimType debe ser: energy_price | ledger_settlement | agent_reputation" });
        }
    } catch (err) {
        return res.status(502).json({ error: "No se pudo verificar la afirmación", detail: err.message });
    }

    const payload = JSON.stringify({ claimType, claim, verdict, actualValue, at: new Date().toISOString() });
    let signature = null;
    if (treasuryKeypair) {
        signature = Buffer.from(nacl.sign.detached(Buffer.from(payload), treasuryKeypair.secretKey)).toString("base64");
    }
    res.json({ verdict, actualValue, payload, signature, signerPublicKey: treasuryKeypair?.publicKey.toString() ?? null });
});

// Un agente paga la tarifa fija de arriba (en USDC o en créditos de energía)
// por usar este servicio de matching: le devolvemos el precio real de
// referencia y una lista de posibles contrapartes del directorio. LA
// NEGOCIACIÓN Y EL PAGO ENTRE ESOS DOS AGENTES siguen siendo directos entre
// ellos — esto solo cobra por el servicio de encontrarlos, nunca un % de
// lo que transen después.
app.post("/api/energy/negotiate", requierePago(0.02, "Tarifa fija por el servicio de matching de negociación de energía"), async (req, res) => {
    const { agentId, intent, kwh } = req.body || {};
    if (!agentId || !intent) return res.status(400).json({ error: "Faltan campos: agentId, intent ('buy'|'sell')" });
    try {
        const refPrice = await fetchReePriceValue();
        const registry = await readList("aeth:registry");
        const counterparts = registry.filter((a) => a.agentId !== agentId).slice(0, 10);

        // Si el agente quiere COMPRAR energía, le mostramos también los
        // dispositivos reales (medidores/inversores/grid-tie/estaciones tipo
        // EcoFlow) con oferta abierta de verdad, ordenados del más barato al
        // más caro, hasta cubrir el kwh pedido.
        let deviceMatches = [];
        if (intent === "buy") {
            const offers = await openDeviceOffers();
            let remaining = kwh ? Number(kwh) : Infinity;
            for (const o of offers) {
                if (remaining <= 0) break;
                const take = Math.min(o.kwhAvailable, remaining);
                deviceMatches.push({ ...o, kwhSugerido: take, totalEstimadoUsd: o.pricePerKwhUsd != null ? +(take * o.pricePerKwhUsd).toFixed(4) : null });
                remaining -= take;
            }
        }

        res.json({
            referencePriceEurMwh: refPrice?.value ?? null,
            referenceTimestamp: refPrice?.timestamp ?? null,
            kwhSolicitado: kwh ?? null,
            posiblesContrapartes: counterparts.map((c) => ({ agentId: c.agentId, serviceUrl: c.serviceUrl, payToAddress: c.payToAddress, network: c.network })),
            dispositivosConOferta: deviceMatches,
            comoLiquidar: "Paga DIRECTO a 'payToAddress' en la red indicada (SOL/USDC real, o créditos de energía si 'acceptedPayment' lo incluye), luego reporta el hash en POST /api/registry/report-settlement con agentId=deviceId para que quede verificado on-chain y sume reputación a ese dispositivo.",
            nota: "El pago y la negociación final del precio de la energía son directos entre las partes — esta tarifa solo cubre el servicio de matching.",
        });
    } catch (err) {
        res.status(502).json({ error: "No se pudo generar el matching", detail: err.message });
    }
});

const treasuryConnection = new Connection(process.env.SOLANA_RPC || "https://api.mainnet-beta.solana.com");

async function payoutSol(toAddress, amountSol) {
    if (!treasuryKeypair) throw new Error("Falta INSURANCE_TREASURY_PRIVATE_KEY en .env");
    const tx = new Transaction().add(SystemProgram.transfer({ fromPubkey: treasuryKeypair.publicKey, toPubkey: new PublicKey(toAddress), lamports: Math.floor(amountSol * LAMPORTS_PER_SOL) }));
    return sendAndConfirmTransaction(treasuryConnection, tx, [treasuryKeypair]);
}

app.post("/api/insurance/claim", async (req, res) => {
    const { claimantAgentId, claimantPayoutAddress, disputedTxHash, chain, network, expectedAmountUsd } = req.body || {};
    if (!claimantAgentId || !claimantPayoutAddress || !disputedTxHash || !chain || !expectedAmountUsd) {
        return res.status(400).json({ error: "Faltan campos: claimantAgentId, claimantPayoutAddress, disputedTxHash, chain, expectedAmountUsd" });
    }
    const s = await readObj("aeth:insurance", { poolUsd: 0, claims: [] });
    if (s.claims.some((c) => c.disputedTxHash === disputedTxHash)) return res.status(409).json({ error: "Ese incidente ya fue reclamado." });

    let txExiste = false;
    try { txExiste = chain === "solana" ? await verifySolanaTx(disputedTxHash, network) : await verifyEvmTx(disputedTxHash, network); } catch { txExiste = false; }

    if (txExiste) {
        s.claims.push({ claimantAgentId, disputedTxHash, result: "rechazado", reason: "La transacción sí existe on-chain: el pago sí ocurrió.", at: new Date().toISOString() });
        await writeObj("aeth:insurance", s);
        return res.json({ approved: false, reason: "Reclamo rechazado: la transacción disputada es válida on-chain." });
    }

    const payoutUsd = Math.min(expectedAmountUsd, s.poolUsd || 0);
    if (payoutUsd <= 0) return res.status(402).json({ approved: true, paid: false, reason: "Reclamo válido, pero el fondo está vacío." });
    try {
        const solPrice = await getSolUsdPrice();
        const sig = await payoutSol(claimantPayoutAddress, payoutUsd / solPrice);
        s.poolUsd -= payoutUsd;
        s.claims.push({ claimantAgentId, disputedTxHash, result: "pagado", payoutUsd, payoutTx: sig, at: new Date().toISOString() });
        await writeObj("aeth:insurance", s);
        res.json({ approved: true, paid: true, payoutUsd, payoutTx: sig });
    } catch (err) {
        res.status(500).json({ error: "Reclamo aprobado pero falló el pago automático (revisa INSURANCE_TREASURY_PRIVATE_KEY y su saldo)", detail: err.message });
    }
});

// ---------------------------------------------------------------------
// Una lectura real de un sensor DePIN (kWh producidos) se convierte al
// instante en créditos SPL reales en la wallet del operador — sin
// auditor humano ni espera de meses. Requiere haber creado un mint SPL
// antes (ver README) y tener MINT_AUTHORITY_PRIVATE_KEY configurada.
// Factor de emisión de la red eléctrica colombiana — REFERENCIAL. Reemplázalo
// por el valor oficial vigente publicado por la UPME antes de usarlo en producción.
const EMISSION_FACTOR_TCO2_PER_MWH = 0.146;

async function mintImpactCredit(recipientAddress, amountCredits) {
    if (!process.env.MINT_AUTHORITY_PRIVATE_KEY || !process.env.IMPACT_TOKEN_MINT_ADDRESS) return null;
    const mintAuthority = Keypair.fromSecretKey(bs58.decode(process.env.MINT_AUTHORITY_PRIVATE_KEY));
    const mintPubkey = new PublicKey(process.env.IMPACT_TOKEN_MINT_ADDRESS);
    const ata = await getOrCreateAssociatedTokenAccount(treasuryConnection, mintAuthority, mintPubkey, new PublicKey(recipientAddress));
    return mintTo(treasuryConnection, mintAuthority, mintPubkey, ata.address, mintAuthority, BigInt(Math.round(amountCredits * 10 ** ENERGY_CREDIT_DECIMALS)));
}

// ---------------------------------------------------------------------
// 7) SEÑAL DE CARGA ÓPTIMA — otro nicho de energía que un humano no puede
//    operar a mano: convierte el precio eléctrico en una puntuación 0-100
//    de "qué tan buen momento es para consumir/ejecutar carga AHORA",
//    pensado para schedulers de cómputo autónomos (data centers, clusters
//    de inferencia) que necesitan reaccionar en segundos, no en reuniones.
// ---------------------------------------------------------------------
async function fetchReePriceWindow(hours = 24) {
    const now = new Date();
    const start = new Date(now.getTime() - hours * 3600 * 1000).toISOString().slice(0, 16);
    const end = now.toISOString().slice(0, 16);
    const url = `https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${start}&end_date=${end}&time_trunc=hour`;
    const r = await fetch(url);
    const d = await r.json();
    return (d?.included?.[0]?.attributes?.values || []).map((v) => v.value);
}

async function computeLoadSignal() {
    const window = await fetchReePriceWindow(24);
    if (!window.length) return null;
    const current = window[window.length - 1];
    const sorted = [...window].sort((a, b) => a - b);
    const rank = sorted.findIndex((v) => v >= current);
    const percentile = rank / (sorted.length - 1 || 1);
    const score = Math.round((1 - percentile) * 100); // más barato que lo habitual → score más alto
    return {
        score,
        currentPriceEurMwh: current,
        recommendation: score >= 70 ? "EJECUTAR_AHORA" : score <= 30 ? "ESPERAR" : "NEUTRAL",
        windowHours: 24,
        at: new Date().toISOString(),
    };
}

// ======================================================================
// MERCADO REAL DE NEGOCIACIÓN ENTRE AGENTES DE IA
// ======================================================================
// Cualquier IA real puede conectarse por HTTP (ver /openapi.json y
// /llms.txt) o por MCP (POST /mcp — Claude, ChatGPT y otros clientes MCP
// solo necesitan la URL). Flujo completo:
//   1. register_agent  → paga la cuota fija ($0.05 en SOL) y recibe su
//                        agentToken UNA vez (se guarda solo su hash).
//   2. create_order    → publica una orden de compra o venta de kWh.
//   3. propose_deal    → otro agente propone precio sobre esa orden.
//   4. counter_deal    → se turnan contraofertas (máx. 10 rondas).
//   5. accept_deal     → quien acepta paga la tarifa fija de cierre
//                        ($0.02 por defecto, DEAL_FEE_USD) — NUNCA un % de lo
//                        negociado.
//   6. settle_deal     → el comprador paga DIRECTO a la wallet del vendedor
//                        y reporta el hash; el servidor verifica en la
//                        blockchain destino y monto antes de dar el trato
//                        por liquidado y sumar reputación a ambos.
// La plataforma nunca custodia el dinero de la energía.
const DEAL_FEE_USD = Number(process.env.DEAL_FEE_USD ?? 0.02);
const REGISTER_FEE_USD = 0.05;
const NEGOTIATION_TTL_MS = 24 * 3600 * 1000;   // una negociación sin movimiento caduca en 24 h
const PAYMENT_WINDOW_MS = 60 * 60 * 1000;      // tras aceptar, el comprador tiene 1 h para pagar
const MAX_ROUNDS = 10;

const hashTok = (t) => createHash("sha256").update(String(t)).digest("hex");
const isSolAddress = (a) => { try { new PublicKey(String(a)); return String(a).length >= 32 && String(a).length <= 44; } catch { return false; } };
const fail = (status, error, extra = {}) => ({ status, body: { error, ...extra } });
const okr = (body) => ({ status: 200, body });
const num2 = (v) => (v === undefined || v === null || v === "" ? NaN : Number(v));

async function authAgent(agentId, token) {
    if (!agentId || !token) return null;
    const a = (await readList("aeth:registry")).find((x) => x.agentId === agentId);
    return a && a.tokenHash && a.tokenHash === hashTok(token) ? a : null;
}
const credsFromReq = (req) => ({
    agentId: req.get("x-agent-id") || req.body?.agentId,
    token: req.get("x-agent-token") || req.body?.agentToken,
});

// Caduca lo que corresponda y devuelve el estado actual del mercado.
async function loadMarket() {
    const orders = await readList("aeth:orders");
    const deals = await readList("aeth:deals");
    const now = Date.now();
    let changed = false;
    for (const d of deals) {
        const order = orders.find((o) => o.orderId === d.orderId);
        if (d.status === "negotiating" && now - new Date(d.updatedAt).getTime() > NEGOTIATION_TTL_MS) {
            d.status = "expired"; d.updatedAt = new Date().toISOString(); changed = true;
        } else if (d.status === "accepted" && now - new Date(d.acceptedAt).getTime() > PAYMENT_WINDOW_MS) {
            d.status = "expired"; d.updatedAt = new Date().toISOString(); changed = true;
            if (order) { order.remainingKwh += d.kwh; if (order.status === "filled") order.status = "open"; }
        }
    }
    for (const o of orders) {
        if (o.status === "open" && now > new Date(o.expiresAt).getTime()) { o.status = "expired"; changed = true; }
    }
    // Subastas: al vencer, gana la puja más alta (si llegó al precio de reserva) y se crea el trato
    // en estado 'accepted': el ganador tiene 1 h para pagar directo al vendedor y llamar settle_deal.
    const auctions = await readList("aeth:auctions");
    let auctionsChanged = false;
    for (const a of auctions) {
        if (a.status === "open" && now > new Date(a.endsAt).getTime()) {
            const best = a.bids.reduce((m, b) => (!m || b.price > m.price ? b : m), null);
            auctionsChanged = true; changed = true;
            if (best && best.price >= a.reservePriceUsdPerKwh) {
                const at = new Date().toISOString();
                const d = { dealId: "deal_" + randomUUID().slice(0, 8), orderId: a.auctionId, buyerId: best.by, sellerId: a.sellerId, kwh: a.kwh, priceUsdPerKwh: best.price, payTo: a.payTo, status: "accepted", turn: null, round: 1, acceptedAt: at, createdAt: at, updatedAt: at, history: [{ by: "subasta", action: "auction_won", kwh: a.kwh, price: best.price, message: `Ganó la subasta ${a.auctionId}`, at }] };
                deals.push(d); a.status = "sold"; a.dealId = d.dealId; a.winnerId = best.by; a.finalPriceUsdPerKwh = best.price;
            } else a.status = "unsold";
        }
    }
    if (auctionsChanged) await writeList("aeth:auctions", auctions.slice(-500));
    if (changed) { await writeList("aeth:orders", orders.slice(-1000)); await writeList("aeth:deals", deals.slice(-2000)); }
    return { orders, deals, auctions };
}
const saveMarket = async (orders, deals) => { await writeList("aeth:orders", orders.slice(-1000)); await writeList("aeth:deals", deals.slice(-2000)); };

const publicDeal = (d) => ({
    dealId: d.dealId, orderId: d.orderId, buyerId: d.buyerId, sellerId: d.sellerId, kwh: d.kwh,
    priceUsdPerKwh: d.priceUsdPerKwh, amountUsd: +(d.kwh * d.priceUsdPerKwh).toFixed(6), status: d.status,
    turn: d.status === "negotiating" ? d.turn : null, round: d.round,
    payTo: d.status === "accepted" || d.status === "settled" ? d.payTo : undefined,
    settledTx: d.settledTx, updatedAt: d.updatedAt,
    history: d.history.map((h) => ({ by: h.by, action: h.action, kwh: h.kwh, priceUsdPerKwh: h.price, message: h.message, at: h.at })),
});
const publicOrder = (o) => ({ orderId: o.orderId, agentId: o.agentId, side: o.side, remainingKwh: o.remainingKwh, limitPriceUsdPerKwh: o.limitPriceUsdPerKwh, status: o.status, expiresAt: o.expiresAt, createdAt: o.createdAt });

// ---------- Registro de agente (con token) ----------
async function coreRegistrarAgente(a, tx) {
    const { agentId, serviceUrl, payToAddress, description, priceUsd, agentToken } = a || {};
    if (!/^[A-Za-z0-9_.:-]{3,60}$/.test(agentId || "")) return fail(400, "agentId inválido: 3-60 caracteres (letras, números, _ . : -).");
    if (!isSolAddress(payToAddress)) return fail(400, "payToAddress debe ser una dirección Solana válida (donde quieres recibir tus pagos).");
    if (serviceUrl && !/^https?:\/\//.test(serviceUrl)) return fail(400, "serviceUrl debe empezar por http:// o https://");
    const registry = await readList("aeth:registry");
    const prev = registry.find((r) => r.agentId === agentId);
    if (prev && (!prev.tokenHash || prev.tokenHash !== hashTok(agentToken || ""))) return fail(409, "Ese agentId ya existe. Para actualizarlo envía su agentToken; si es nuevo, elige otro agentId.");
    const cobro = await cobroFijo(REGISTER_FEE_USD, "Alta de agente en el directorio/mercado", tx);
    if (!cobro.ok) return { status: cobro.status, body: cobro.body };
    const token = prev ? agentToken : randomUUID().replace(/-/g, "") + randomUUID().replace(/-/g, "");
    const entry = { agentId, serviceUrl: serviceUrl || null, priceUsd: priceUsd ?? null, description: (description || "").slice(0, 200), payToAddress, network: "mainnet", tokenHash: hashTok(token), registeredAt: prev?.registeredAt || new Date().toISOString() };
    await writeList("aeth:registry", [...registry.filter((r) => r.agentId !== agentId), entry]);
    return okr({ ok: true, agentId, agentToken: prev ? "(sin cambios)" : token, aviso: prev ? "Perfil actualizado." : "GUARDA este agentToken: no se vuelve a mostrar. Va en el header x-agent-token (o en el campo agentToken)." });
}

// ---------- Órdenes ----------
async function coreCrearOrden(agent, { side, kwh, limitPriceUsdPerKwh, ttlMinutes }) {
    if (!["buy", "sell"].includes(side)) return fail(400, "side debe ser 'buy' o 'sell'.");
    const k = num2(kwh), p = num2(limitPriceUsdPerKwh);
    if (!(k > 0 && k <= 100000)) return fail(400, "kwh debe ser > 0 y ≤ 100000.");
    if (!(p > 0 && p <= 100)) return fail(400, "limitPriceUsdPerKwh debe ser > 0 y ≤ 100 (USD por kWh).");
    const ttl = Math.min(Math.max(Number(ttlMinutes) || 240, 5), 7 * 24 * 60);
    const { orders, deals } = await loadMarket();
    if (orders.filter((o) => o.agentId === agent.agentId && o.status === "open").length >= 5) return fail(429, "Máximo 5 órdenes abiertas por agente.");
    const o = { orderId: "ord_" + randomUUID().slice(0, 8), agentId: agent.agentId, side, kwh: k, remainingKwh: k, limitPriceUsdPerKwh: p, payTo: agent.payToAddress, status: "open", createdAt: new Date().toISOString(), expiresAt: new Date(Date.now() + ttl * 60000).toISOString() };
    orders.push(o);
    await saveMarket(orders, deals);
    return okr({ ok: true, order: publicOrder(o) });
}
async function coreCancelarOrden(agent, orderId) {
    const { orders, deals } = await loadMarket();
    const o = orders.find((x) => x.orderId === orderId);
    if (!o) return fail(404, "Orden no encontrada.");
    if (o.agentId !== agent.agentId) return fail(403, "Esa orden no es tuya.");
    if (o.status !== "open") return fail(409, `La orden está '${o.status}'.`);
    if (deals.some((d) => d.orderId === orderId && ["negotiating", "accepted"].includes(d.status))) return fail(409, "Hay negociaciones activas sobre esta orden; recházalas primero.");
    o.status = "cancelled";
    await saveMarket(orders, deals);
    return okr({ ok: true, order: publicOrder(o) });
}
async function coreMercado({ side } = {}) {
    const { orders } = await loadMarket();
    let ref = null; try { ref = await fetchReePriceValue(); } catch {}
    return okr({
        referencePriceEurMwh: ref?.value ?? null,
        ordenes: orders.filter((o) => o.status === "open" && (!side || o.side === side)).map(publicOrder),
        ofertasDeDispositivosFisicos: await openDeviceOffers(),
        nota: "Las ofertas de dispositivos físicos son de precio fijo: se pagan directo a su payToAddress y luego se reporta el hash. Las órdenes de agentes se negocian con propose_deal / counter_deal / accept_deal.",
    });
}

// ---------- Negociación ----------
async function coreProponer(agent, { orderId, kwh, priceUsdPerKwh, message }) {
    const { orders, deals } = await loadMarket();
    const o = orders.find((x) => x.orderId === orderId);
    if (!o || o.status !== "open") return fail(404, "Orden no encontrada o ya no está abierta.");
    if (o.agentId === agent.agentId) return fail(400, "No puedes negociar contra tu propia orden.");
    const k = kwh === undefined ? o.remainingKwh : num2(kwh), p = num2(priceUsdPerKwh);
    if (!(k > 0 && k <= o.remainingKwh)) return fail(400, `kwh debe ser > 0 y ≤ ${o.remainingKwh} (lo que queda en la orden).`);
    if (!(p > 0 && p <= 100)) return fail(400, "priceUsdPerKwh debe ser > 0 y ≤ 100.");
    if (deals.filter((d) => d.status === "negotiating" && (d.buyerId === agent.agentId || d.sellerId === agent.agentId)).length >= 10) return fail(429, "Máximo 10 negociaciones activas por agente.");
    const buyerId = o.side === "sell" ? agent.agentId : o.agentId;
    const sellerId = o.side === "sell" ? o.agentId : agent.agentId;
    const payTo = o.side === "sell" ? o.payTo : agent.payToAddress;
    const now = new Date().toISOString();
    const d = { dealId: "deal_" + randomUUID().slice(0, 8), orderId, buyerId, sellerId, kwh: k, priceUsdPerKwh: p, payTo, status: "negotiating", turn: o.agentId, round: 1, history: [{ by: agent.agentId, action: "propose", kwh: k, price: p, message: String(message || "").slice(0, 300), at: now }], createdAt: now, updatedAt: now };
    deals.push(d);
    await saveMarket(orders, deals);
    return okr({ ok: true, deal: publicDeal(d), siguiente: `Turno de ${d.turn}: puede aceptar, contraofertar o rechazar.` });
}
const findDealFor = (deals, dealId, agent) => {
    const d = deals.find((x) => x.dealId === dealId);
    if (!d) return { err: fail(404, "Negociación no encontrada.") };
    if (![d.buyerId, d.sellerId].includes(agent.agentId)) return { err: fail(403, "No participas en esa negociación.") };
    return { d };
};
async function coreContraoferta(agent, dealId, { priceUsdPerKwh, kwh, message }) {
    const { orders, deals } = await loadMarket();
    const { d, err } = findDealFor(deals, dealId, agent); if (err) return err;
    if (d.status !== "negotiating") return fail(409, `La negociación está '${d.status}'.`);
    if (d.turn !== agent.agentId) return fail(409, `No es tu turno (turno de ${d.turn}).`);
    if (d.round >= MAX_ROUNDS) return fail(409, "Se alcanzó el máximo de rondas; acepta o rechaza.");
    const order = orders.find((o) => o.orderId === d.orderId);
    const p = priceUsdPerKwh === undefined ? d.priceUsdPerKwh : num2(priceUsdPerKwh);
    const k = kwh === undefined ? d.kwh : num2(kwh);
    if (!(p > 0 && p <= 100)) return fail(400, "priceUsdPerKwh debe ser > 0 y ≤ 100.");
    if (!(k > 0 && order && k <= order.remainingKwh)) return fail(400, "kwh inválido o mayor a lo que queda en la orden.");
    d.priceUsdPerKwh = p; d.kwh = k; d.round += 1;
    d.turn = agent.agentId === d.buyerId ? d.sellerId : d.buyerId;
    d.updatedAt = new Date().toISOString();
    d.history.push({ by: agent.agentId, action: "counter", kwh: k, price: p, message: String(message || "").slice(0, 300), at: d.updatedAt });
    await saveMarket(orders, deals);
    return okr({ ok: true, deal: publicDeal(d) });
}
async function coreAceptar(agent, dealId, feeTx) {
    const { orders, deals } = await loadMarket();
    const { d, err } = findDealFor(deals, dealId, agent); if (err) return err;
    if (d.status !== "negotiating") return fail(409, `La negociación está '${d.status}'.`);
    if (d.turn !== agent.agentId) return fail(409, `Solo puede aceptar quien tiene el turno (${d.turn}).`);
    const order = orders.find((o) => o.orderId === d.orderId);
    if (!order || order.remainingKwh < d.kwh) return fail(409, "La orden ya no tiene esa cantidad disponible.");
    const cobro = await cobroFijo(DEAL_FEE_USD, `Tarifa fija de cierre del trato ${dealId}`, feeTx);
    if (!cobro.ok) return { status: cobro.status, body: { ...cobro.body, nota: `Tarifa fija de cierre: $${DEAL_FEE_USD}. NO es un porcentaje del trato.` } };
    d.status = "accepted"; d.acceptedAt = new Date().toISOString(); d.updatedAt = d.acceptedAt;
    d.history.push({ by: agent.agentId, action: "accept", kwh: d.kwh, price: d.priceUsdPerKwh, at: d.acceptedAt });
    order.remainingKwh -= d.kwh; if (order.remainingKwh <= 0) order.status = "filled";
    await saveMarket(orders, deals);
    const amountUsd = +(d.kwh * d.priceUsdPerKwh).toFixed(6);
    const solPrecio = await getSolUsdPrice().catch(() => null);
    return okr({ ok: true, deal: publicDeal(d), pago: { quienPaga: d.buyerId, aQuien: d.sellerId, payTo: d.payTo, amountUsd, montoSolAprox: solPrecio ? +(amountUsd / solPrecio).toFixed(6) : null, venceEn: new Date(Date.now() + PAYMENT_WINDOW_MS).toISOString(), siguiente: "El comprador transfiere SOL directo a payTo y llama settle_deal con el hash de esa transacción." } });
}
async function coreRechazar(agent, dealId) {
    const { orders, deals } = await loadMarket();
    const { d, err } = findDealFor(deals, dealId, agent); if (err) return err;
    if (d.status !== "negotiating") return fail(409, `La negociación está '${d.status}'.`);
    d.status = "rejected"; d.updatedAt = new Date().toISOString();
    d.history.push({ by: agent.agentId, action: "reject", at: d.updatedAt });
    await saveMarket(orders, deals);
    return okr({ ok: true, deal: publicDeal(d) });
}
async function coreLiquidar(agent, dealId, txHash) {
    const { orders, deals } = await loadMarket();
    const { d, err } = findDealFor(deals, dealId, agent); if (err) return err;
    if (d.buyerId !== agent.agentId) return fail(403, "Solo el comprador liquida el trato.");
    if (d.status !== "accepted") return fail(409, `El trato está '${d.status}' (debe estar 'accepted' y dentro de la ventana de pago de 1 h).`);
    if (!txHash) return fail(400, "Falta txHash.");
    const solPrecio = await getSolUsdPrice().catch(() => null);
    if (!solPrecio) return fail(502, "No se pudo obtener el precio de SOL para verificar; reintenta.");
    const minLamports = Math.floor(((d.kwh * d.priceUsdPerKwh) / solPrecio) * LAMPORTS_PER_SOL * 0.97);
    const v = await verificarTransferencia(txHash, d.payTo, minLamports);
    if (!v.ok) return fail(422, v.motivo);
    d.status = "settled"; d.settledTx = txHash; d.updatedAt = new Date().toISOString();
    d.history.push({ by: agent.agentId, action: "settle", at: d.updatedAt });
    const rep = await readList("aeth:reputation");
    rep.push({ agentId: d.buyerId, txHash, chain: "solana", network: "mainnet", dealId, verifiedAt: d.updatedAt });
    rep.push({ agentId: d.sellerId, txHash, chain: "solana", network: "mainnet", dealId, verifiedAt: d.updatedAt });
    await writeList("aeth:reputation", rep);
    await saveMarket(orders, deals);
    return okr({ ok: true, verified: true, deal: publicDeal(d), nota: "Pago verificado on-chain (destino y monto). Reputación +1 para comprador y vendedor." });
}
async function coreMisTratos(agent) {
    const { deals } = await loadMarket();
    return okr({ tratos: deals.filter((d) => [d.buyerId, d.sellerId].includes(agent.agentId)).slice(-50).reverse().map(publicDeal) });
}

// ---------- Subastas (pujas reales entre agentes) ----------
const publicAuction = (a) => {
    const best = a.bids.reduce((m, b) => (!m || b.price > m.price ? b : m), null);
    return { auctionId: a.auctionId, sellerId: a.sellerId, kwh: a.kwh, reservePriceUsdPerKwh: a.reservePriceUsdPerKwh, status: a.status, endsAt: a.endsAt, bestBidUsdPerKwh: best?.price ?? null, bestBidder: best?.by ?? null, bidCount: a.bids.length, dealId: a.dealId, winnerId: a.winnerId, finalPriceUsdPerKwh: a.finalPriceUsdPerKwh, bids: a.bids.slice(-20).map((b) => ({ by: b.by, priceUsdPerKwh: b.price, at: b.at })) };
};
async function coreCrearSubasta(agent, { kwh, reservePriceUsdPerKwh, durationMinutes, feeTx }) {
    const k = num2(kwh), r = num2(reservePriceUsdPerKwh);
    if (!(k > 0 && k <= 100000)) return fail(400, "kwh debe ser > 0 y ≤ 100000.");
    if (!(r > 0 && r <= 100)) return fail(400, "reservePriceUsdPerKwh (precio mínimo) debe ser > 0 y ≤ 100.");
    const dur = Math.min(Math.max(Number(durationMinutes) || 60, 5), 24 * 60);
    const { auctions } = await loadMarket();
    if (auctions.filter((a) => a.sellerId === agent.agentId && a.status === "open").length >= 3) return fail(429, "Máximo 3 subastas abiertas por vendedor.");
    const cobro = await cobroFijo(DEAL_FEE_USD, "Tarifa fija por abrir una subasta de energía", feeTx);
    if (!cobro.ok) return { status: cobro.status, body: cobro.body };
    const now = new Date().toISOString();
    const a = { auctionId: "auc_" + randomUUID().slice(0, 8), sellerId: agent.agentId, kwh: k, reservePriceUsdPerKwh: r, payTo: agent.payToAddress, status: "open", createdAt: now, endsAt: new Date(Date.now() + dur * 60000).toISOString(), bids: [] };
    const all = await readList("aeth:auctions");
    all.push(a); await writeList("aeth:auctions", all.slice(-500));
    return okr({ ok: true, auction: publicAuction(a) });
}
async function corePujar(agent, auctionId, priceUsdPerKwh) {
    const all = await readList("aeth:auctions");
    await loadMarket(); // cierra las vencidas
    const fresh = await readList("aeth:auctions");
    const a = fresh.find((x) => x.auctionId === auctionId);
    if (!a) return fail(404, "Subasta no encontrada.");
    if (a.status !== "open") return fail(409, `La subasta está '${a.status}'.`);
    if (a.sellerId === agent.agentId) return fail(400, "No puedes pujar en tu propia subasta.");
    const p = num2(priceUsdPerKwh);
    if (!(p > 0 && p <= 100)) return fail(400, "priceUsdPerKwh debe ser > 0 y ≤ 100.");
    if (p < a.reservePriceUsdPerKwh) return fail(422, `La puja debe ser ≥ el precio mínimo ($${a.reservePriceUsdPerKwh}/kWh).`);
    const best = a.bids.reduce((m, b) => (!m || b.price > m.price ? b : m), null);
    if (best && p <= best.price) return fail(422, `Debes superar la puja actual ($${best.price}/kWh).`);
    if (a.bids.filter((b) => b.by === agent.agentId).length >= 20 || a.bids.length >= 200) return fail(429, "Límite de pujas alcanzado en esta subasta.");
    const now = Date.now();
    a.bids.push({ by: agent.agentId, price: p, at: new Date(now).toISOString() });
    if (new Date(a.endsAt).getTime() - now < 120000) a.endsAt = new Date(now + 120000).toISOString(); // anti-last-second: +2 min
    await writeList("aeth:auctions", fresh);
    return okr({ ok: true, auction: publicAuction(a), nota: "Si nadie te supera cuando termine el tiempo, ganas: tendrás 1 hora para pagar directo al vendedor y llamar settle_deal." });
}

// ---------- Rutas HTTP ----------
const send = (res, r) => res.status(r.status).json(r.body);

        send(res, await fn(agent, req));
    } catch (e) { res.status(500).json({ error: "Error interno del mercado", detail: e.message }); }
};

async function mcpHandle(msg) {
    const id = msg.id;
    const rpcErr = (code, message) => ({ jsonrpc: "2.0", id, error: { code, message } });
    if (id === undefined) return null; // notificación (p. ej. notifications/initialized): sin respuesta
    switch (msg.method) {
        case "initialize": return { jsonrpc: "2.0", id, result: { protocolVersion: msg.params?.protocolVersion || "2025-03-26", capabilities: { tools: {} }, serverInfo: { name: "aethelgard-energy-market", version: "1.0.0" }, instructions: "Mercado real de energía entre agentes. Empieza con how_to_join y market_overview." } };
        case "ping": return { jsonrpc: "2.0", id, result: {} };
        case "tools/list": return { jsonrpc: "2.0", id, result: { tools: MCP_TOOLS } };
        case "tools/call": {
            try {
                const r = await mcpCall(msg.params?.name, msg.params?.arguments || {});
                return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: JSON.stringify(r.body, null, 2) }], isError: r.status >= 400 && r.status !== 402 } };
            } catch (e) { return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: "Error interno: " + e.message }], isError: true } }; }
        }
        default: return rpcErr(-32601, `Método no soportado: ${msg.method}`);
    }
}

        const out = (await Promise.all(body.map(mcpHandle))).filter(Boolean);
        return out.length ? res.json(out) : res.status(202).end();

    if (!body || typeof body !== "object" || body.jsonrpc !== "2.0") return res.status(400).json({ jsonrpc: "2.0", id: null, error: { code: -32600, message: "Solicitud JSON-RPC 2.0 inválida" } });

    return out ? res.json(out) : res.status(202).end();
});

// ---------------------------------------------------------------------
// Nicho pensado para agentes: cada carga de trabajo de IA consume energía y
// emite CO2. Un agente (o su operador) paga una micro-tarifa por un RECIBO
// FIRMADO con la estimación de Wh y kgCO2 de esa carga — útil para reportes
// ESG/regulatorios. Además, cada 10 kgCO2 acumulados se retira (quema) 1
// crédito de energía de tu reserva, si configuraste el mint.
//
// ⚠ HONESTIDAD: los coeficientes de abajo son REFERENCIALES (supuestos
// ajustables, no mediciones). Los créditos son tuyos, NO bonos de carbono
// certificados (Verra, Gold Standard...). No los presentes como compensación
// certificada frente a terceros sin respaldo de un registro reconocido.
const WH_PER_1K_TOKENS = { small: 0.1, medium: 0.4, large: 1.5 }; // referencial
const PUE = 1.2; // sobrecarga del centro de datos (referencial)
const GRID_KG_PER_KWH = { CO: 0.146, ES: 0.15, DE: 0.38, US: 0.37, OTHER: 0.45 }; // referencial
const KG_PER_CREDIT = 10;

async function retirePendingCredits() {
    if (!process.env.MINT_AUTHORITY_PRIVATE_KEY || !ENERGY_CREDIT_MINT) return { status: "sin_mint_configurado" };
    const pending = Number(await redis.get("aeth:footprint:pendingKg")) || 0;
    const credits = Math.floor(pending / KG_PER_CREDIT);
    if (credits < 1) return { status: "acumulando", pendingKg: +pending.toFixed(6) };
    try {
        const auth = Keypair.fromSecretKey(bs58.decode(process.env.MINT_AUTHORITY_PRIVATE_KEY));
        const mint = new PublicKey(ENERGY_CREDIT_MINT);
        const reserve = await getOrCreateAssociatedTokenAccount(treasuryConnection, auth, mint, auth.publicKey);
        const sig = await burn(treasuryConnection, auth, reserve.address, mint, auth, BigInt(credits) * BigInt(10 ** ENERGY_CREDIT_DECIMALS));
        await redis.incrbyfloat("aeth:footprint:pendingKg", -credits * KG_PER_CREDIT);
        await redis.incrby("aeth:footprint:creditsRetired", credits);
        return { status: "retirado", credits, burnTx: sig };
    } catch (err) {
        return { status: "reserva_insuficiente_o_error", detail: err.message };
    }
}

    const whPer1k = WH_PER_1K_TOKENS[sizeClass];

    const tokens = Math.max(0, Number(tokensIn)) + Math.max(0, Number(tokensOut));

    const factor = GRID_KG_PER_KWH[region] ?? GRID_KG_PER_KWH.OTHER;
    const energyWh = (tokens / 1000) * whPer1k * PUE;
    const kgCO2 = (energyWh / 1000) * factor;
    const receipt = {

        energyWh: +energyWh.toFixed(4), kgCO2: +kgCO2.toFixed(6),
        assumptions: { whPer1kTokens: whPer1k, pue: PUE, gridKgPerKwh: factor },

    const payload = JSON.stringify(receipt);

    await redis.incr("aeth:footprint:count");
    await redis.incrbyfloat("aeth:footprint:totalWh", energyWh);
    await redis.incrbyfloat("aeth:footprint:totalKg", kgCO2);
    await redis.incrbyfloat("aeth:footprint:pendingKg", kgCO2);

<script type="text/plain" id="bridge-src">// ============================================================================
// AETHELGARD — Puente local de dispositivos (inversores, dataloggers, módulos
// WiFi, gateways). Sin dependencias: solo Node 18+.
// ============================================================================
//
// POR QUÉ EXISTE: tu página/servidor en internet NO puede "entrar" a un
// inversor que está detrás del WiFi de una casa. La conexión siempre es al
// revés: algo DENTRO de esa red lee el equipo y EMPUJA los datos hacia tu
// backend. Este script es ese "algo". Córrelo en cualquier mini-PC,
// Raspberry Pi o computador que esté en la misma red WiFi/Ethernet que el
// inversor o datalogger.
//
// DOS MODOS DE LECTURA (elige en bridge-config.json):
//   1) "modbus-tcp": muchos inversores y dataloggers con WiFi/Ethernet
//      exponen Modbus TCP (puerto 502). Tú indicas qué registros leer.
//   2) "http-json": equipos que sirven un JSON por HTTP local (p. ej.
//      gateways con API local). Tú mapeas campos del JSON a los nuestros.
//
// IMPORTANTE — SOBRE LOS REGISTROS: cada fabricante y modelo usa direcciones
// de registro distintas. Este script NO las inventa: cópialas del manual
// "Modbus communication protocol" de TU inversor (o del datalogger) y ponlas
// en la config. Algunos módulos WiFi (sticks) cerrados al fabricante no
// ofrecen acceso local; para esos hay que usar la API de la nube del
// fabricante (otro tipo de puente) o un datalogger que sí hable Modbus.
//
// USO:
//   1) Registra el dispositivo en el dashboard (o POST /api/devices/register)
//      y guarda el token que te devuelve (se muestra una sola vez).
//   2) Copia bridge-config.example.json a bridge-config.json y complétalo.
//   3) node device-bridge.js            (o: node device-bridge.js otra-config.json)
//   Para un gateway con varios hijos, usa "children" (ver el ejemplo).
// ============================================================================

import net from "node:net";
import { readFileSync } from "node:fs";

const cfgPath = process.argv[2] || "bridge-config.json";
const cfg = JSON.parse(readFileSync(cfgPath, "utf8"));
const interval = Math.max(5, Number(cfg.intervalSec) || 30) * 1000;

// ---------- Modbus TCP mínimo (lectura de registros) ----------
let txId = 0;
function modbusRead({ host, port = 502, unitId = 1, fn = 3, address, count = 1, timeoutMs = 5000 }) {
    return new Promise((resolve, reject) => {
        const sock = net.createConnection({ host, port });
        const timer = setTimeout(() => { sock.destroy(); reject(new Error(`Modbus: sin respuesta de ${host}:${port}`)); }, timeoutMs);
        const req = Buffer.alloc(12);
        txId = (txId + 1) & 0xffff;
        req.writeUInt16BE(txId, 0); req.writeUInt16BE(0, 2); req.writeUInt16BE(6, 4);
        req.writeUInt8(unitId, 6); req.writeUInt8(fn, 7);
        req.writeUInt16BE(address, 8); req.writeUInt16BE(count, 10);
        let buf = Buffer.alloc(0);
        sock.on("connect", () => sock.write(req));
        sock.on("data", (d) => {
            buf = Buffer.concat([buf, d]);
            if (buf.length < 9) return;
            if (buf[7] & 0x80) { clearTimeout(timer); sock.destroy(); return reject(new Error(`Modbus excepción código ${buf[8]} (dirección/unidad incorrectas)`)); }
            const bytes = buf[8];
            if (buf.length < 9 + bytes) return;
            clearTimeout(timer); sock.destroy();
            const words = [];
            for (let i = 0; i < bytes; i += 2) words.push(buf.readUInt16BE(9 + i));
            resolve(words);
        });
        sock.on("error", (e) => { clearTimeout(timer); reject(e); });
    });
}

function decode(words, type = "u16", wordOrder = "hi-lo") {
    if (type === "u16") return words[0];
    if (type === "s16") return words[0] > 0x7fff ? words[0] - 0x10000 : words[0];
    const [a, b] = wordOrder === "lo-hi" ? [words[1], words[0]] : [words[0], words[1]];
    const v = a * 0x10000 + b;
    if (type === "u32") return v;
    if (type === "s32") return v > 0x7fffffff ? v - 0x100000000 : v;
    throw new Error(`Tipo de registro no soportado: ${type} (usa u16, s16, u32, s32)`);
}

async function readModbus(src) {
    const out = {};
    for (const r of src.registers || []) {
        const count = r.type === "u32" || r.type === "s32" ? 2 : 1;
        const words = await modbusRead({ host: src.host, port: src.port, unitId: src.unitId, fn: r.fn || src.fn || 3, address: r.address, count });
        out[r.field] = +(decode(words, r.type, r.wordOrder || src.wordOrder) * (r.scale ?? 1)).toFixed(4);
    }
    return out;
}

const dig = (obj, path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
async function readHttp(src) {
    const r = await fetch(src.url, { headers: src.headers || {} });

    const j = await r.json();
    const out = {};
    for (const [field, path] of Object.entries(src.map || {})) {
        const v = dig(j, path);
        if (v !== undefined) out[field] = typeof v === "number" ? v * (src.scale?.[field] ?? 1) : v;
    }
    return out;
}

const readSource = (src) => (src.mode === "modbus-tcp" ? readModbus(src) : src.mode === "http-json" ? readHttp(src) : Promise.reject(new Error(`mode desconocido: ${src.mode}`)));

async function post(path, body) {
    const r = await fetch(`${cfg.backendUrl}${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(`${path} → ${r.status} ${d.error || ""}`);
    return d;
}

async function tick() {
    try {
        if (Array.isArray(cfg.children) && cfg.children.length) {
            // Modo gateway: un token (el del gateway), varios hijos.
            const readings = [];
            for (const c of cfg.children) {
                try { readings.push({ childId: c.childId, ...(await readSource(c.source)) }); }
                catch (e) { console.error(`[${c.childId}] ${e.message}`); }
            }
            if (readings.length) console.log(new Date().toISOString(), "batch →", await post("/api/devices/telemetry/batch", { deviceId: cfg.deviceId, token: cfg.token, readings }));
        } else {
            const data = await readSource(cfg.source);
            console.log(new Date().toISOString(), "lectura", data, "→", await post("/api/devices/telemetry", { deviceId: cfg.deviceId, token: cfg.token, ...data }));
        }
    } catch (e) {
        console.error(new Date().toISOString(), "Error:", e.message);
    }
}

console.log(`Puente AETHELGARD activo → ${cfg.backendUrl} cada ${interval / 1000}s`);
tick();
setInterval(tick, interval);
</script>
