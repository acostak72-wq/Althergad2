<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD | FULL UNIFIED OMNI-CORE SIMULATOR v2026</title>
    
    <!-- Librerías Frontend (CDNs) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #010204; --panel: rgba(8, 10, 15, 0.98); --glw: #14F195; 
            --sol: #9945FF; --eurd: #0A58CA; --aeth: #FFD700; --crisis: #ff1e1e;
            --co2: #2dd4bf; --pacto: #00F2FF;
        }
        body { background-color: var(--bg); color: #94a3b8; font-family: 'Outfit', sans-serif; overflow: hidden; margin: 0; font-size: 11px; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-rack { background: var(--panel); border: 1px solid rgba(255, 215, 0, 0.15); backdrop-filter: blur(25px); position: relative; }
        .rack-unit { background: linear-gradient(180deg, #0d0f16 0%, #050608 100%); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; position: relative; overflow: hidden; transition: 0.3s; }
        
        .ai-orb { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--aeth)); box-shadow: 0 0 25px var(--aeth); animation: breathe 4s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        .btn-side { width: 100%; text-align: left; padding: 10px; font-weight: 800; text-transform: uppercase; font-size: 8px; border-left: 3px solid transparent; transition: 0.3s; color: #666; cursor: pointer; }
        .btn-side.active { background: rgba(20, 241, 149, 0.05); border-left-color: var(--glw); color: var(--glw); }
        .btn-action { background: var(--aeth); color: #000; font-weight: 900; padding: 8px 14px; text-transform: uppercase; font-size: 8px; cursor: pointer; border: none; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s; }
        .btn-action:hover { filter: brightness(1.2); }

        .predator-active { border-color: var(--crisis) !important; animation: predator-pulse 2s infinite; }
        @keyframes predator-pulse { 0% { box-shadow: 0 0 5px var(--crisis); } 50% { box-shadow: 0 0 20px var(--crisis); } 100% { box-shadow: 0 0 5px var(--crisis); } }

        .invoice-paper { background: #fff; color: #000; padding: 40px; font-family: 'JetBrains Mono', monospace; }
        @media print { .no-print { display: none !important; } .invoice-modal { background: white; position: fixed; inset: 0; z-index: 9999; } }

        .agent-msg { background: rgba(20, 241, 149, 0.05); border-left: 3px solid var(--glw); padding: 8px; margin-bottom: 8px; }
        .user-msg { background: rgba(255, 255, 255, 0.05); border-right: 3px solid #fff; padding: 8px; margin-bottom: 8px; text-align: right; }

        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 255, 0.01); position: fixed; z-index: 9999; pointer-events: none; animation: scan 10s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--aeth); border-radius: 10px; }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CEO_ID = "Karen Andrea Corredor Acosta";
    const CO_CREATOR = "Kelly Paola Corredor Acosta";
    const NIT = "901.455.882-1";

    const App = () => {
        const [booting, setBooting] = useState(true);
        const [tab, setTab] = useState('nexus');
        const [isAutoPredator, setIsAutoPredator] = useState(false);
        const [dutchPrice, setDutchPrice] = useState(180.00);
        const [marketPrice, setMarketPrice] = useState(145.50);
        const [co2Saved, setCo2Saved] = useState(1420.50);
        const [selectedInvoice, setSelectedInvoice] = useState(null);

        // --- GEMELO DIGITAL DE HARDWARE (ECOFLOW / ESP32 SIMULADO) ---
        const [telemetry, setTelemetry] = useState({
            batteryLevel: 82,
            solarInputWatts: 320,
            gridOutputWatts: 110,
            isDaytime: true,
            pins: { 26: true, 27: false, 14: true }
        });

        // --- BÓVEDA Y CONTABILIDAD PGC (Servidor virtual interno) ---
        const [vault, setVault] = useState({
            fiatEUR: 12450.00,
            usdc: 5500.00,
            eurd: 4200.00,
            arcticFund: 8400.00,
            pgc: {
                "705.0": 0, // Ingresos Brutos M2M/M2P
                "629.0": 0, // Mantenimiento (30%)
                "201.0": 0, // I+D (20%)
                "650.0": 0, // Fondo Ártico ONG (20%)
                "640.0": 0, // Nóminas (25%)
                "475.0": 0  // Impuestos Ley (5%)
            }
        });

        // --- PROSUMIDOR HUMANO (M2P) ---
        const [prosumer, setProsumer] = useState({
            kwhSold: 120,
            balanceUsd: 45.60,
            logs: ["[INIT] Sistema M2P preparado. Esperando solicitudes de compra de IAs..."]
        });

        // --- HISTORIALES Y FACTURAS ---
        const [ledger, setLedger] = useState([]);
        const [invoices, setInvoices] = useState([]);

        // --- AGENTES DE IA CONECTADOS AL PROTOCOLO x402 ---
        const connectedAgents = [
            { id: "AGENT-OPENAI-01", name: "GPT-4o Execution Engine", wallet: "0x71C...8A9", protocol: "x402 / HTTP" },
            { id: "AGENT-CLAUDE-02", name: "Anthropic Claude Researcher", wallet: "0x3A2...9F1", protocol: "MCP Remote" },
            { id: "AGENT-DEEPSEEK-03", name: "DeepSeek Quantum Trader", wallet: "0x9E4...1B2", protocol: "x402 / Solana" }
        ];

        // --- AUDITOR CHAT IA ---
        const [chatQuery, setChatQuery] = useState('');
        const [chatHistory, setChatHistory] = useState([
            { s: 'ai', t: 'Archon AI Auditor v2026 listo. Servidor y Hardware Twin sincronizados.' }
        ]);

        // 1. CICLO DEL GEMELO DIGITAL Y MERCADO (Hardware & Subasta)
        useEffect(() => {
            if (booting) {
                setTimeout(() => setBooting(false), 1800);
                return;
            }

            const physicsLoop = setInterval(() => {
                // Simulación física de la batería y paneles solares
                setTelemetry(prev => {
                    const solar = prev.isDaytime ? Math.floor(180 + Math.random() * 250) : 0;
                    const grid = Math.floor(60 + Math.random() * 90);
                    let deltaBatt = (solar - grid) / 500;
                    let newBatt = Math.min(100, Math.max(5, prev.batteryLevel + deltaBatt));

                    return {
                        ...prev,
                        solarInputWatts: solar,
                        gridOutputWatts: grid,
                        batteryLevel: +newBatt.toFixed(2),
                        isDaytime: Math.random() > 0.05 ? prev.isDaytime : !prev.isDaytime
                    };
                });

                // Fluctuación de Precios de Energía en Mercado OMIE
                const newMkt = +(110 + Math.random() * 70).toFixed(2);
                setMarketPrice(newMkt);
                setDutchPrice(p => p > 80 ? +(p - 1.2).toFixed(2) : 190.00);

                // Bot Autónomo Auto-Predator
                if (isAutoPredator) {
                    if (dutchPrice < newMkt - 6) {
                        executeTrade('M2M', 30.0, "Auto-Predator: Arbitraje M2M Energía", "AGENT-DEEPSEEK-03");
                    }
                }
            }, 2500);

            return () => clearInterval(physicsLoop);
        }, [booting, isAutoPredator, dutchPrice]);

        // 2. MOTOR DE PROTOCOLO x402 & TRANSACCIONES (Sustituto de backend)
        const executeTrade = (mode, amount, concept, party) => {
            const fee = amount * 0.12; // Fee del 12%
            const net = amount - fee;

            // Desglose PGC con 5% de Impuestos
            const split = {
                ops: fee * 0.30,
                rd: fee * 0.20,
                arctic: fee * 0.20,
                pay: fee * 0.25,
                tax: fee * 0.05
            };

            setVault(prev => {
                const upPgc = { ...prev.pgc };
                upPgc["705.0"] += amount;
                upPgc["629.0"] += split.ops;
                upPgc["201.0"] += split.rd;
                upPgc["650.0"] += split.arctic;
                upPgc["640.0"] += split.pay;
                upPgc["475.0"] += split.tax;

                return {
                    ...prev,
                    fiatEUR: mode === 'M2P' ? prev.fiatEUR + net : prev.fiatEUR,
                    usdc: mode === 'M2M' ? prev.usdc + net : prev.usdc,
                    pgc: upPgc
                };
            });

            // Repercusión física en la batería
            setTelemetry(prev => ({
                ...prev,
                batteryLevel: Math.max(0, Math.min(100, prev.batteryLevel + (mode === 'M2M' ? 1.5 : -2)))
            }));

            // Registro en Ledger
            const timestamp = new Date().toLocaleTimeString();
            const txId = `TX-${Date.now()}`;
            setLedger(prev => [{
                id: txId,
                time: timestamp,
                mode,
                party,
                concept,
                bruto: amount.toFixed(2),
                fee: fee.toFixed(2),
                net: net.toFixed(2)
            }, ...prev].slice(0, 40));

            // Generación de Factura Legal
            const invId = `INV-${Math.floor(1000 + Math.random() * 9000)}`;
            setInvoices(prev => [{
                id: invId,
                hash: "0x" + Math.random().toString(36).substring(2, 12).toUpperCase(),
                date: new Date().toLocaleString(),
                client: party,
                description: `[${mode}] ${concept}`,
                amount: amount,
                tax: amount * 0.19,
                total: amount * 1.19,
                mode
            }, ...prev].slice(0, 40));

            setCo2Saved(prev => prev + 0.5);
        };

        // Acciones Específicas
        const handleProsumerSale = () => {
            const kwh = Math.floor(Math.random() * 40) + 10;
            const gross = kwh * 0.14;
            setProsumer(prev => ({
                kwhSold: prev.kwhSold + kwh,
                balanceUsd: prev.balanceUsd + (gross * 0.98),
                logs: [`[${new Date().toLocaleTimeString()}] 🤖 IA_TeslaBot compró ${kwh}kWh por $${gross.toFixed(2)} USD`, ...prev.logs].slice(0, 20)
            }));
            executeTrade('M2P', gross, `Venta Solar Prosumidor (${kwh} kWh)`, 'IA_TeslaBot');
        };

        const convertUsdcToFiat = (usdcAmount) => {
            if (vault.usdc < usdcAmount) return alert("Saldo insuficiente en USDC.");
            const netEur = usdcAmount * 0.92;
            setVault(prev => ({
                ...prev,
                usdc: prev.usdc - usdcAmount,
                fiatEUR: prev.fiatEUR + netEur
            }));
            executeTrade('SWAP', usdcAmount, `Conversión Directa USDC -> EUR Banco Real`, 'SWAP-ENGINE');
        };

        const sellESGBook = () => {
            const price = 20.00;
            setVault(prev => ({ ...prev, arcticFund: prev.arcticFund + price }));
            executeTrade('P2M', price, 'Venta Obra "Luz Persistente" (Donación ONG Ártico)', 'DONANTE-ESG');
        };

        const handleChatSubmit = (e) => {
            e.preventDefault();
            if (!chatQuery.trim()) return;
            const q = chatQuery.toLowerCase();
            setChatHistory(prev => [...prev, { s: 'user', t: chatQuery }]);
            setChatQuery('');

            setTimeout(() => {
                let r = "Consulta auditada. Los balances concuerdan con los registros PGC.";
                if (q.includes('bateria') || q.includes('hardware') || q.includes('esp32')) 
                    r = `Telemetría Hardware: Batería al ${telemetry.batteryLevel}%. Entrada Solar: ${telemetry.solarInputWatts}W. Salida: ${telemetry.gridOutputWatts}W.`;
                else if (q.includes('bov') || q.includes('fiat') || q.includes('usdc')) 
                    r = `Bóveda Soberana: €${vault.fiatEUR.toFixed(2)} EUR en Banco Fiat Real | $${vault.usdc.toFixed(2)} USDC en protocolo.`;
                else if (q.includes('impuesto') || q.includes('pgc') || q.includes('5%'))
                    r = `Subcuenta PGC 475.0 (Impuestos 5%): €${vault.pgc["475.0"].toFixed(2)} retenidos correctamente.`;
                setChatHistory(prev => [...prev, { s: 'ai', t: r }]);
            }, 600);
        };

        if (booting) return (
            <div className="h-screen bg-black flex flex-col items-center justify-center font-mono">
                <div className="ai-orb mb-8"></div>
                <p className="text-aeth text-xs tracking-[1em] animate-pulse font-black uppercase">AETHELGARD OMNI-CORE v2026</p>
                <p className="text-white/30 text-[8px] mt-3">INICIALIZANDO GEMELO DIGITAL & MOTOR DE PAGOS x402...</p>
            </div>
        );

        return (
            <div className="h-screen flex flex-col p-3 gap-3 overflow-hidden select-none">
                <div className="scanline"></div>

                {/* MODAL DE FACTURA LEGAL IMPRIMIBLE */}
                {selectedInvoice && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-10 invoice-modal">
                        <div className="invoice-paper w-full max-w-2xl relative shadow-2xl border-t-8 border-black">
                            <button onClick={() => setSelectedInvoice(null)} className="no-print absolute top-5 right-5 text-black font-black text-xl">×</button>
                            <div className="flex justify-between border-b-2 border-black pb-5 mb-8">
                                <div>
                                    <h1 className="text-xl font-black">AETHELGARD SUPREME</h1>
                                    <p className="text-[9px]">NIT: {NIT}</p>
                                    <p className="text-[8px] text-gray-600 mt-1">CEO: {CEO_ID}<br/>CO-CREATOR: {CO_CREATOR}</p>
                                </div>
                                <div className="text-right font-black">
                                    <h2>FACTURA ELECTRÓNICA</h2>
                                    <p className="text-lg">{selectedInvoice.id}</p>
                                    <span className="text-[8px] bg-black text-white px-2 py-0.5">{selectedInvoice.mode}</span>
                                </div>
                            </div>
                            <table className="w-full text-[9px] mb-8 text-left">
                                <thead className="border-b border-black"><tr><th className="py-2">DESCRIPCIÓN CONCEPTO</th><th className="text-right py-2">SUBTOTAL</th></tr></thead>
                                <tbody><tr><td className="py-4 uppercase">{selectedInvoice.description}</td><td className="text-right py-4 font-bold">€{selectedInvoice.amount.toFixed(2)}</td></tr></tbody>
                            </table>
                            <div className="flex justify-end text-[12px] font-black border-t-2 border-black pt-3">TOTAL REAL (+IVA): €{selectedInvoice.total.toFixed(2)}</div>
                            <div className="mt-16 border-t pt-4 text-[7px] italic flex justify-between uppercase font-mono">
                                <span>Hash Blockchain: {selectedInvoice.hash}</span>
                                <button onClick={() => window.print()} className="no-print bg-black text-white px-4 py-1 font-black not-italic">IMPRIMIR FACTURA PDF</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* HEADER SOBERANO */}
                <header className={`glass-rack p-3.5 rounded flex justify-between items-center transition-all ${isAutoPredator ? 'predator-active' : 'border-aeth'}`}>
                    <div className="flex items-center gap-4">
                        <div className="ai-orb"></div>
                        <div>
                            <h1 className="text-md font-black text-white italic uppercase tracking-tighter">AETHELGARD <span className="text-glw">UNIFIED 2026</span></h1>
                            <p className="text-[7px] text-white/40 font-mono uppercase tracking-widest">{CEO_ID} & {CO_CREATOR}</p>
                        </div>
                    </div>

                    <div className="flex items-center gap-6">
                        <div className="text-right bg-black/40 px-3 py-1.5 border border-white/5 rounded">
                            <p className="text-glw font-black text-xs">€{vault.fiatEUR.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
                            <p className="text-[6px] text-white/40 uppercase font-bold">Banco Fiat Real</p>
                        </div>
                        <div className="text-right bg-black/40 px-3 py-1.5 border border-white/5 rounded">
                            <p className="text-aeth font-black text-xs">${vault.usdc.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
                            <p className="text-[6px] text-white/40 uppercase font-bold">Bóveda USDC (IAs)</p>
                        </div>

                        <div className="flex items-center gap-3 bg-black/40 px-3 py-1.5 border border-white/5 rounded">
                            <span className={`text-[7px] font-black ${isAutoPredator ? 'text-crisis animate-pulse' : 'text-white/20'}`}>AUTO-PREDATOR</span>
                            <button onClick={() => setIsAutoPredator(!isAutoPredator)} className={`w-10 h-5 rounded-full relative transition ${isAutoPredator ? 'bg-crisis' : 'bg-gray-800'}`}>
                                <div className={`absolute top-0.5 w-4 h-4 bg-black rounded-full transition-all ${isAutoPredator ? 'left-5' : 'left-0.5'}`}></div>
                            </button>
                        </div>
                    </div>
                </header>

                <div className="flex-grow flex gap-3 overflow-hidden">
                    {/* BARRA LATERAL */}
                    <aside className="w-52 flex flex-col gap-1.5 no-print">
                        {[
                            {id: 'nexus', name: 'Nexus M2M & IA', icon: 'robot'},
                            {id: 'prosumer', name: 'Panel Humano (M2P)', icon: 'user-astronaut'},
                            {id: 'vault', name: 'Bóveda & Conversión', icon: 'vault'},
                            {id: 'pgc', name: 'Gobernanza PGC (5%)', icon: 'landmark'},
                            {id: 'hardware', name: 'ESP32 Hardware Twin', icon: 'microchip'},
                            {id: 'green', name: 'Pacto Ártico (ESG)', icon: 'leaf'},
                            {id: 'billing', name: 'Facturación Legal', icon: 'file-invoice-dollar'},
                            {id: 'ledger', name: 'Libro Mayor Live', icon: 'list-ol'},
                            {id: 'quantum', name: 'Quantum AI Auditor', icon: 'brain'}
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`btn-side rack-unit ${tab === t.id ? 'active' : ''}`}>
                                <i className={`fas fa-${t.icon} mr-2.5 w-4 text-center`}></i>{t.name}
                            </button>
                        ))}

                        {/* GAUGE BATERÍA ESP32 */}
                        <div className="mt-auto rack-unit p-3.5 text-center flex flex-col items-center">
                            <div className="flex justify-between w-full text-[8px] text-white/50 mb-1 font-mono">
                                <span>SOLAR: {telemetry.solarInputWatts}W</span>
                                <span>{telemetry.batteryLevel}%</span>
                            </div>
                            <div className="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                                <div className="bg-glw h-full transition-all duration-700" style={{ width: `${telemetry.batteryLevel}%` }}></div>
                            </div>
                            <p className="text-[7px] text-white/30 mt-1 uppercase font-bold">Estado Hardware Batería</p>
                        </div>
                    </aside>

                    {/* VISTA PRINCIPAL */}
                    <main className="flex-grow glass-rack rounded p-4 flex flex-col gap-4 overflow-hidden relative">
                        
                        {/* 1. NEXUS M2M & IA */}
                        {tab === 'nexus' && (
                            <div className="grid grid-cols-12 gap-4 h-full">
                                <div className="col-span-8 flex flex-col gap-4">
                                    <div className="grid grid-cols-3 gap-3">
                                        <div className="rack-unit p-4 border-t-2 border-aeth text-center">
                                            <p className="text-[7px] text-white/40 uppercase font-bold">Subasta Holandesa IA</p>
                                            <p className="text-2xl font-black text-aeth font-mono">€{dutchPrice.toFixed(2)}</p>
                                        </div>
                                        <div className="rack-unit p-4 border-t-2 border-glw text-center">
                                            <p className="text-[7px] text-white/40 uppercase font-bold">Precio Mercado EPEX</p>
                                            <p className="text-2xl font-black text-white font-mono">€{marketPrice.toFixed(2)}</p>
                                        </div>
                                        <div className="rack-unit p-4 border-t-2 border-pacto text-center">
                                            <p className="text-[7px] text-pacto uppercase font-bold">Protocolo Activo</p>
                                            <p className="text-lg font-black text-white font-mono">x402 / HTTP</p>
                                        </div>
                                    </div>

                                    <div className="rack-unit p-4 flex-grow flex flex-col">
                                        <h3 className="text-[8px] font-black text-glw uppercase mb-3">Agentes de IA Conectados</h3>
                                        <div className="flex-grow overflow-auto">
                                            <table className="w-full text-[9px] font-mono text-left">
                                                <thead className="bg-black/60 text-white/40 border-b border-white/10">
                                                    <tr><th className="py-2">Agente</th><th className="py-2">Wallet</th><th className="py-2">Acción M2M</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {connectedAgents.map(ag => (
                                                        <tr key={ag.id} className="hover:bg-white/5">
                                                            <td className="py-2.5 text-white font-bold">{ag.name}</td>
                                                            <td className="py-2.5 text-white/40">{ag.wallet}</td>
                                                            <td className="py-2.5">
                                                                <button onClick={() => executeTrade('M2M', 25.0, `Compra Recurso Compute M2M de ${ag.name}`, ag.id)} className="bg-white/10 text-white px-2 py-1 text-[7px] uppercase font-bold hover:bg-glw hover:text-black">Ejecutar Trade</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                                <div className="col-span-4 rack-unit p-3.5 overflow-y-auto">
                                    <h3 className="text-[8px] font-black text-white/30 uppercase mb-3">Feed Transaccional Live</h3>
                                    {ledger.slice(0, 10).map(l => (
                                        <div key={l.id} className="mb-2 p-2 bg-white/5 rounded border-l-2 border-glw text-[8px] font-mono">
                                            <div className="flex justify-between text-white/40"><span>{l.time}</span><span className="text-aeth">{l.mode}</span></div>
                                            <p className="text-white font-bold my-1">{l.concept}</p>
                                            <p className="text-glw">Neto: ${l.net}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 2. PANEL PROSUMIDOR HUMANO (M2P) */}
                        {tab === 'prosumer' && (
                            <div className="h-full flex flex-col gap-4">
                                <div className="rack-unit p-5 border-t-4 border-emerald-500 bg-black/40">
                                    <h2 className="text-md font-black text-white flex items-center gap-2 mb-3">
                                        <i className="fas fa-user-astronaut text-emerald-400"></i>
                                        Venta de Energía Solar Humana a IAs (M2P)
                                    </h2>
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div className="bg-black/60 p-3 rounded border border-white/5">
                                            <p className="text-[8px] text-white/40 uppercase font-bold">Energía Inyectada</p>
                                            <p className="text-2xl font-mono font-black text-white">{prosumer.kwhSold} <small className="text-xs">kWh</small></p>
                                        </div>
                                        <div className="bg-black/60 p-3 rounded border border-white/5">
                                            <p className="text-[8px] text-white/40 uppercase font-bold">Saldo Generado (Neto)</p>
                                            <p className="text-2xl font-mono font-black text-emerald-400">${prosumer.balanceUsd.toFixed(2)} <small className="text-xs">USD</small></p>
                                        </div>
                                    </div>
                                    <button onClick={handleProsumerSale} className="btn-action bg-emerald-500 text-black">Simular que una IA te compra energía</button>
                                </div>

                                <div className="rack-unit p-4 flex-grow flex flex-col">
                                    <h3 className="text-[8px] font-black text-emerald-400 uppercase mb-2">Logs M2P en Tiempo Real</h3>
                                    <div className="flex-grow overflow-auto font-mono text-[9px] text-emerald-400 bg-black/60 p-3 rounded border border-white/5">
                                        {prosumer.logs.map((log, idx) => <div key={idx} className="border-b border-white/5 py-1">{log}</div>)}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. BÓVEDA & CONVERSIÓN */}
                        {tab === 'vault' && (
                            <div className="h-full flex flex-col gap-5">
                                <h2 className="text-white font-black italic uppercase">Bóveda Soberana & Liquidez</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="rack-unit p-5 border-l-4 border-glw bg-black/40">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Banco Fiat Real (Payouts)</p>
                                        <p className="text-2xl font-black text-glw font-mono mt-1">€{vault.fiatEUR.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
                                    </div>
                                    <div className="rack-unit p-5 border-l-4 border-aeth bg-black/40">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Bóveda USDC (Cobros IA)</p>
                                        <p className="text-2xl font-black text-aeth font-mono mt-1">${vault.usdc.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
                                    </div>
                                    <div className="rack-unit p-5 border-l-4 border-pacto bg-black/40">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Fondo Ártico ONG</p>
                                        <p className="text-2xl font-black text-pacto font-mono mt-1">€{vault.arcticFund.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
                                    </div>
                                </div>

                                <div className="rack-unit p-6 flex-grow flex flex-col justify-center items-center text-center">
                                    <i className="fas fa-arrows-rotate text-4xl text-aeth mb-3 animate-spin-slow"></i>
                                    <h3 className="text-white font-black uppercase text-sm mb-2">Convertir Stablecoins USDC a Banco Real (Euros)</h3>
                                    <p className="text-[9px] text-white/40 mb-4 max-w-sm">Convierte fondos acumulados de IAs a liquidez bancaria.</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => convertUsdcToFiat(100)} className="btn-action bg-glw text-black">Convertir $100 USDC</button>
                                        <button onClick={() => convertUsdcToFiat(1000)} className="btn-action bg-aeth text-black">Convertir $1,000 USDC</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 4. GOBERNANZA PGC CON 5% IMPUESTOS */}
                        {tab === 'pgc' && (
                            <div className="h-full flex flex-col">
                                <h2 className="text-white font-black italic uppercase mb-4">Gobernanza Contable Plan General (PGC)</h2>
                                <div className="grid grid-cols-3 gap-4 flex-grow content-center">
                                    {[
                                        { n: "705.0 Ingresos Brutos", v: vault.pgc["705.0"], c: "border-glw" },
                                        { n: "629.0 Mantenimiento Ops (30%)", v: vault.pgc["629.0"], c: "border-white" },
                                        { n: "201.0 I+D Tecnología (20%)", v: vault.pgc["201.0"], c: "border-sol" },
                                        { n: "650.0 Preservación Ártico (20%)", v: vault.pgc["650.0"], c: "border-pacto" },
                                        { n: "640.0 Nóminas & Equipo (25%)", v: vault.pgc["640.0"], c: "border-emerald-400" },
                                        { n: "475.0 Impuestos de Ley (5%)", v: vault.pgc["475.0"], c: "border-crisis text-crisis" }
                                    ].map((acc, i) => (
                                        <div key={i} className={`rack-unit p-5 border-l-4 ${acc.c} bg-black/40`}>
                                            <p className="text-[8px] text-white/50 font-bold uppercase mb-2">{acc.n}</p>
                                            <p className="text-2xl font-black font-mono">€{acc.v.toLocaleString('es-ES', { minimumFractionDigits: 2 })}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 5. HARDWARE TWIN ESP32 */}
                        {tab === 'hardware' && (
                            <div className="h-full flex flex-col gap-4">
                                <h2 className="text-white font-black uppercase italic">ESP32 & EcoFlow Hardware Telemetry Twin</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="rack-unit p-5 border-l-4 border-glw">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Carga Solar Entrada</p>
                                        <p className="text-3xl font-mono font-black text-glw mt-1">{telemetry.solarInputWatts} W</p>
                                    </div>
                                    <div className="rack-unit p-5 border-l-4 border-aeth">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Consumo Servidor Salida</p>
                                        <p className="text-3xl font-mono font-black text-aeth mt-1">{telemetry.gridOutputWatts} W</p>
                                    </div>
                                    <div className="rack-unit p-5 border-l-4 border-pacto">
                                        <p className="text-[8px] text-white/40 uppercase font-bold">Nivel Batería Física</p>
                                        <p className="text-3xl font-mono font-black text-pacto mt-1">{telemetry.batteryLevel}%</p>
                                    </div>
                                </div>
                                <div className="flex-grow rack-unit p-4 bg-black font-mono text-[9px] text-glw border border-white/5 overflow-auto">
                                    [HARDWARE_TWIN] Status: ONLINE_SIMULATED<br/>
                                    [MQTT_LOG] Telemetría recibida desde relé ESP32 PIN_26<br/>
                                    [POWER_FLOW] Inyección estabilizada. Frecuencia: 50.01 Hz
                                </div>
                            </div>
                        )}

                        {/* 6. PACTO ÁRTICO (ESG) */}
                        {tab === 'green' && (
                            <div className="grid grid-cols-2 gap-6 h-full p-6 items-center">
                                <div className="rack-unit p-8 border-l-4 border-pacto text-center">
                                    <i className="fas fa-snowflake text-5xl text-pacto mb-4 animate-pulse"></i>
                                    <h3 className="text-white font-black text-xl uppercase mb-2">"Luz Persistente"</h3>
                                    <p className="text-[9px] text-white/50 mb-6">Fondo consignado directamente a ONGs medioambientales para la preservación del Ártico.</p>
                                    <button onClick={sellESGBook} className="btn-action bg-pacto text-black w-full py-3">Vender Ejemplar (€20.00 Donación)</button>
                                </div>
                                <div className="space-y-4">
                                    <div className="rack-unit p-6 border-l-4 border-glw"><p className="text-white/40 text-[8px] mb-1 font-bold">CO2 Evitado Evidenciado</p><p className="text-4xl font-black text-glw font-mono">{co2Saved.toFixed(2)} KG</p></div>
                                    <div className="rack-unit p-6 border-l-4 border-pacto"><p className="text-white/40 text-[8px] mb-1 font-bold">Fondo Acumulado ONG Ártico</p><p className="text-4xl font-black text-pacto font-mono">€{vault.arcticFund.toLocaleString()}</p></div>
                                </div>
                            </div>
                        )}

                        {/* 7. FACTURACIÓN LEGAL */}
                        {tab === 'billing' && (
                            <div className="h-full flex flex-col">
                                <h2 className="text-white font-black uppercase mb-3 italic">Hub Facturación Electrónica</h2>
                                <div className="flex-grow rack-unit overflow-auto">
                                    <table className="w-full text-[9px] font-mono text-left">
                                        <thead className="bg-black text-white/30 uppercase sticky top-0">
                                            <tr><th className="p-3">ID Factura</th><th className="p-3">Cliente / IA</th><th className="p-3">Modo</th><th className="p-3">Total (+IVA)</th><th className="p-3">Acción</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {invoices.map(inv => (
                                                <tr key={inv.id}>
                                                    <td className="p-3 text-aeth font-bold">{inv.id}</td>
                                                    <td className="p-3 uppercase">{inv.client}</td>
                                                    <td className="p-3"><span className="bg-white/10 px-2 py-0.5 text-glw font-bold">{inv.mode}</span></td>
                                                    <td className="p-3 text-white font-bold">€{inv.total.toFixed(2)}</td>
                                                    <td className="p-3"><button onClick={() => setSelectedInvoice(inv)} className="bg-white text-black px-3 py-1 font-bold">Ver Factura</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 8. LIBRO MAYOR */}
                        {tab === 'ledger' && (
                            <div className="h-full flex flex-col">
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="text-white font-black italic uppercase">Auditoría del Libro Mayor</h2>
                                    <button onClick={() => {
                                        const ws = XLSX.utils.json_to_sheet(ledger);
                                        const wb = XLSX.utils.book_new();
                                        XLSX.utils.book_append_sheet(wb, ws, "Auditoria");
                                        XLSX.writeFile(wb, "Aethelgard_Ledger_v2026.xlsx");
                                    }} className="btn-action bg-emerald-600 text-white">Exportar Excel</button>
                                </div>
                                <div className="flex-grow overflow-auto rack-unit">
                                    <table className="w-full text-[9px] font-mono text-left">
                                        <thead className="bg-black text-white/30 uppercase sticky top-0">
                                            <tr><th className="p-3">Hora</th><th className="p-3">Modo</th><th className="p-3">Contraparte</th><th className="p-3">Concepto</th><th className="p-3">Bruto</th><th className="p-3 text-glw">Fee (12%)</th><th className="p-3 text-aeth">Neto</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {ledger.map(l => (
                                                <tr key={l.id}>
                                                    <td className="p-3 text-white/30">{l.time}</td>
                                                    <td className="p-3 text-aeth font-bold">{l.mode}</td>
                                                    <td className="p-3 font-bold text-white">{l.party}</td>
                                                    <td className="p-3">{l.concept}</td>
                                                    <td className="p-3">${l.bruto}</td>
                                                    <td className="p-3 text-glw">${l.fee}</td>
                                                    <td className="p-3 text-aeth font-bold">${l.net}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 9. QUANTUM AI AUDITOR */}
                        {tab === 'quantum' && (
                            <div className="h-full flex flex-col">
                                <h2 className="text-white font-black italic uppercase mb-3">Archon Quantum AI Auditor Chat</h2>
                                <div className="flex-grow rack-unit p-4 overflow-y-auto font-mono text-[9px] mb-3">
                                    {chatHistory.map((m, i) => (
                                        <div key={i} className={m.s === 'ai' ? 'agent-msg' : 'user-msg'}>
                                            <p className="text-[6px] uppercase opacity-40 mb-1">{m.s === 'ai' ? 'Archon Auditor' : 'Operador'}</p>
                                            {m.t}
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={handleChatSubmit} className="flex gap-2">
                                    <input value={chatQuery} onChange={e => setChatQuery(e.target.value)} placeholder="Consultar sobre Bóveda, Hardware ESP32 o Impuestos PGC..." className="flex-grow bg-black border border-white/10 p-2.5 text-[9px] text-white rounded outline-none focus:border-glw" />
                                    <button type="submit" className="btn-action">Auditar</button>
                                </form>
                            </div>
                        )}

                    </main>
                </div>

                {/* FOOTER */}
                <footer className="glass-rack px-4 py-1.5 rounded flex justify-between items-center text-[7px] font-bold uppercase tracking-widest text-white/30 font-mono">
                    <div>AETHELGARD OMNI-CORE SIMULATOR // NIT: {NIT}</div>
                    <div className="text-glw">HARDWARE TELEMETRY: OK</div>
                    <div>CEO: {CEO_ID}</div>
                </footer>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
