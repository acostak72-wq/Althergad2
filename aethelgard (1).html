            footer: `Aethelgard Deutschland GmbH // CEO: ${CEO_NAME}`, locale: 'de-DE', currency: '€', jurisdiction: 'Deutschland (HGB)'

    const App = () => {
        // --- CORE STATES ---
        const [tab, setTab] = useState('depin');
        const [booting, setBooting] = useState(true);
        const [lang, setLang] = useState('es');
        const L = LANG[lang];
        
        const [wallet, setWallet] = useState({ eurd: 4850200.50, sol: 1250.5, glw: 450000, arctic_fund: 6840, books: 342, pgc: { "705": 0, "629": 0, "201": 0, "650": 0, "640": 0, "475": 0 } });
        const [oracles, setOracles] = useState({ omie: 145.20, xm: 645.20, ree: 50.00, ufd: 82.5 });
        const [market, setMarket] = useState({ dutchPrice: 180.00, liveWatts: 0, aiPrice: 0, action: 'ANALYZING' });
        const [co2Saved, setCo2Saved] = useState(1245.80);
        const [invoices, setInvoices] = useState([]);
        const [selectedInvoice, setSelectedInvoice] = useState(null);
        const [query, setQuery] = useState('');
        const [chatHistory, setChatHistory] = useState([{ s: 'ai', t: 'Archon Quantum-Logic Agent Online. Consultando base de datos soberana...' }]);
        
        const [aiMsg, setAiMsg] = useState("SISTEMA EN LÍNEA. PROTOCOLO GHOST ACTIVO.");
        const [aiKey, setAiKey] = useState(0); 

        const [sysLogs, setSysLogs] = useState([]);
        const [ledger, setLedger] = useState([]);
        const [enclaves, setEnclaves] = useState([]);
        const [syndicateChat, setSyndicateChat] = useState([]);

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        // --- DATOS Y CONEXIONES REALES (no simuladas) ---
        const RPC_ENDPOINT = "https://api.mainnet-beta.solana.com";
        const SOL_MINT = "So11111111111111111111111111111111111111112";
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";

        const [realPrices, setRealPrices] = useState({ solUsd: null, solEur: null, lastUpdate: null });
        const [reeReal, setReeReal] = useState({ price: null, lastUpdate: null, error: null });
        const [xmManual, setXmManual] = useState({ price: 223.78, unit: "COP/kWh", lastUpdate: "Informe mensual XM (manual)" });
        const [phantom, setPhantom] = useState({ connected: false, pubkey: null, solBalance: null, connecting: false, provider: null });
        const [jupQuote, setJupQuote] = useState(null);
        const [swapStatus, setSwapStatus] = useState("");

        // --- CONEXIÓN AL BACKEND REAL (pago directo en SOL — seguro mutuo + impacto) ---
        const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem("aeth_backend_url") || "");
        const [insurance, setInsurance] = useState({ poolUsd: 0, totalClaims: 0, pagados: 0 });
        const [impactLog, setImpactLog] = useState([]);
        const [claimForm, setClaimForm] = useState({ claimantAgentId: "", claimantPayoutAddress: "", disputedTxHash: "", chain: "solana", network: "devnet", expectedAmountUsd: 1 });
        const [backendMsg, setBackendMsg] = useState("");
        const [catalog, setCatalog] = useState([]);
        const [agpeKwh, setAgpeKwh] = useState(50);
        const [devices, setDevices] = useState([]);
        const [deviceForm, setDeviceForm] = useState({ deviceId: '', type: 'meter', connectivity: 'wifi', capacityKw: '', payToAddress: '', pricePerKwhUsd: '' });
        const [newDeviceToken, setNewDeviceToken] = useState('');
        const [newDeviceId, setNewDeviceId] = useState('');
        const [deviceOffers, setDeviceOffers] = useState([]);
        const [offerForm, setOfferForm] = useState({ deviceId: '', token: '', kwhAvailable: '', pricePerKwhUsd: '' });
        const [negotiateForm, setNegotiateForm] = useState({ agentId: '', intent: 'buy', kwh: '' });
        const [negotiateResult, setNegotiateResult] = useState(null);
        const [footprintStats, setFootprintStats] = useState(null);

        const fetchFootprintStats = async () => {
            if (!backendUrl) return;
            try { const r = await fetch(`${backendUrl}/api/footprint/stats`); setFootprintStats(await r.json()); } catch (e) { setBackendMsg("No se pudieron cargar las estadísticas: " + e.message); }
        };
        const [predictionStatus, setPredictionStatus] = useState({ open: null, recent: [] });

        const fetchPredictionStatus = async () => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            try { const r = await fetch(`${backendUrl}/api/futures/status`); setPredictionStatus(await r.json()); } catch (e) { setBackendMsg("No se pudo cargar el mercado: " + e.message); }
        };
        const stakePrediction = async (side) => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            if (!phantom.connected) { speakAI("Conecta tu wallet real para poder recibir el pago si ganas."); return; }
            try {
                const r = await fetch(`${backendUrl}/api/futures/stake-${side}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agentId: ID_MASTER, payoutAddress: phantom.pubkey }) });
                const d = await r.json();
                setBackendMsg(d.ok ? `Apuesta registrada (${side.toUpperCase()}) en el mercado de las ${d.market}h.` : (d.error || "No se pudo apostar."));
                fetchPredictionStatus();
            } catch (e) { setBackendMsg("Error apostando: " + e.message); }
        };

        const fetchDevices = async () => {
            if (!backendUrl) return;
            try { const r = await fetch(`${backendUrl}/api/devices/registry`); setDevices(await r.json()); } catch (e) { setBackendMsg("No se pudo cargar el registro de dispositivos: " + e.message); }
        };
        const registerDevice = async (e) => {
            e.preventDefault();
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            try {
                const r = await fetch(`${backendUrl}/api/devices/register`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(deviceForm) });
                const d = await r.json();
                if (d.token) {
                    setNewDeviceToken(d.token);
                    setNewDeviceId(d.deviceId);
                    setOfferForm(f => ({ ...f, deviceId: d.deviceId, token: d.token, pricePerKwhUsd: deviceForm.pricePerKwhUsd }));
                    fetchDevices();
                } else { setBackendMsg(d.error || "No se pudo registrar."); }
            } catch (e) { setBackendMsg("Error registrando dispositivo: " + e.message); }
        };

        // Oferta real de negociación: el dueño del dispositivo publica cuánta
        // energía tiene disponible AHORA y a qué precio — esto es lo que
        // /api/energy/negotiate usa para emparejar con agentes compradores.
        // No se cobra por esto (es el dispositivo anunciándose, no comprando).
        const fetchDeviceOffers = async () => {
            if (!backendUrl) return;
            try { const r = await fetch(`${backendUrl}/api/devices/offers`); setDeviceOffers(await r.json()); } catch (e) { setBackendMsg("No se pudieron cargar las ofertas: " + e.message); }
        };
        const submitDeviceOffer = async (e) => {
            e.preventDefault();
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            if (!offerForm.deviceId || !offerForm.token) { setBackendMsg("Necesitas el deviceId y el token del dispositivo (se te dio una sola vez al registrarlo)."); return; }
            try {
                const r = await fetch(`${backendUrl}/api/devices/offer`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(offerForm) });
                const d = await r.json();
                setBackendMsg(d.ok ? `Oferta publicada: ${d.kwhAvailable} kWh a $${d.pricePerKwhUsd}/kWh.` : (d.error || "No se pudo publicar la oferta."));
                fetchDeviceOffers(); fetchDevices();
            } catch (e) { setBackendMsg("Error publicando la oferta: " + e.message); }
        };

        // Un agente (o tú mismo probando) pide negociar: paga la tarifa fija
        // de matching y recibe contrapartes reales — agentes del directorio
        // Y dispositivos con oferta abierta de verdad. Si el backend responde
        // 402 (pago requerido), y ya tienes Solflare conectado, el propio
        // dashboard paga esa tarifa EN SOL REAL con tu wallet, confirma la
        // transacción y repite la consulta — todo en un clic, sin necesitar
        // ninguna librería ni cuenta especial del lado del agente.
        const runNegotiate = async () => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            if (!negotiateForm.agentId) { setBackendMsg("Ponle un agentId a tu solicitud de negociación."); return; }
            const body = JSON.stringify({ ...negotiateForm, kwh: negotiateForm.kwh ? Number(negotiateForm.kwh) : undefined });
            try {
                setBackendMsg("Buscando contrapartes reales...");
                let r = await fetch(`${backendUrl}/api/energy/negotiate`, { method: "POST", headers: { "Content-Type": "application/json" }, body });
                if (r.status === 402) {
                    const pago = await r.json();
                    if (!phantom.connected) { setBackendMsg(`Esto cuesta ~${pago.montoSolAprox} SOL (tarifa real de matching). Conecta tu wallet Solflare arriba para pagarlo y continuar.`); return; }
                    setBackendMsg(`Pagando ~${pago.montoSolAprox} SOL con tu wallet real...`);
                    const provider = getWalletProvider();
                    const connection = new solanaWeb3.Connection(RPC_ENDPOINT);
                    const tx = new solanaWeb3.Transaction().add(solanaWeb3.SystemProgram.transfer({
                        fromPubkey: new solanaWeb3.PublicKey(phantom.pubkey),
                        toPubkey: new solanaWeb3.PublicKey(pago.payTo),
                        lamports: Math.round(pago.montoSolAprox * 1e9),
                    }));
                    const { blockhash } = await connection.getLatestBlockhash();
                    tx.recentBlockhash = blockhash;
                    tx.feePayer = new solanaWeb3.PublicKey(phantom.pubkey);
                    const { signature } = await provider.signAndSendTransaction(tx);
                    setBackendMsg("Pago real enviado, confirmando en la red...");
                    await connection.confirmTransaction(signature, "confirmed");
                    addLog(`Pago real de matching enviado: ${signature}`, "NEGOTIATE");
                    r = await fetch(`${backendUrl}/api/energy/negotiate?tx=${signature}`, { method: "POST", headers: { "Content-Type": "application/json" }, body });
                }
                const d = await r.json();
                setNegotiateResult(d);
                setBackendMsg(d.error ? d.error : "Matching recibido (pago real verificado on-chain).");
            } catch (e) { setBackendMsg("Error negociando: " + e.message); }
        };

        const fetchCatalog = async () => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            try { const r = await fetch(`${backendUrl}/api/datamarket/catalog`); setCatalog(await r.json()); } catch (e) { setBackendMsg("No se pudo cargar el catálogo: " + e.message); }
        };

        const saveBackendUrl = (url) => { setBackendUrl(url); localStorage.setItem("aeth_backend_url", url); };

        const fetchInsuranceStatus = async () => {
            if (!backendUrl) return;
            try { const r = await fetch(`${backendUrl}/api/insurance/status`); setInsurance(await r.json()); } catch (e) { setBackendMsg("No se pudo contactar el backend: " + e.message); }
        };
        const fetchImpactLog = async () => {
            if (!backendUrl) return;
            try { const r = await fetch(`${backendUrl}/api/impact/ledger`); setImpactLog(await r.json()); } catch (e) { setBackendMsg("No se pudo contactar el backend: " + e.message); }
        };
        const submitClaim = async () => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            setBackendMsg("Enviando reclamo y verificando on-chain...");
            try {
                const r = await fetch(`${backendUrl}/api/insurance/claim`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(claimForm) });
                const d = await r.json();
                setBackendMsg(d.paid ? `✔ Reclamo pagado: ${d.payoutUsd} USD (tx ${d.payoutTx?.slice(0, 10)}...)` : (d.reason || d.error || "Reclamo procesado."));
                fetchInsuranceStatus();
            } catch (e) { setBackendMsg("Error enviando el reclamo: " + e.message); }
        };
        const mintRealImpact = async () => {
            if (!backendUrl) { setBackendMsg("Configura primero la URL de tu backend."); return; }
            if (!phantom.connected) { speakAI("Conecta tu wallet real primero para recibir el crédito."); return; }
            setBackendMsg("Verificando lectura del sensor y acuñando crédito real...");
            try {
                const r = await fetch(`${backendUrl}/api/impact/verify-and-mint`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId: "ESP32-AETH-01", kwhProduced: market.liveWatts ? market.liveWatts / 10 : 5, recipientAddress: phantom.pubkey }) });
                const d = await r.json();
                setBackendMsg(d.minted ? `✔ ${d.credits} créditos acuñados on-chain (tx ${d.mintTx?.slice(0, 10)}...)` : `Registrado (${d.credits} créditos), pero falta configurar el mint SPL en el backend.`);
                fetchImpactLog();
            } catch (e) { setBackendMsg("Error al acuñar: " + e.message); }
        };

        // --- HELPER FUNCTIONS ---
        const speakAI = (msg) => { setAiMsg(msg); setAiKey(k => k + 1); };
        const addLog = (msg, type = "SYS") => setSysLogs(p => [`[${new Date().toLocaleTimeString()}] [${type}] ${msg}`, ...p].slice(0, 40));
        const addChat = (agent, msg, color) => setSyndicateChat(p => [{time: new Date().toLocaleTimeString(), agent, msg, color}, ...p].slice(0, 15));

        // --- FUNCIONES REALES: precios, oráculo REE, wallet y swap ---
        const fetchRealPrices = async () => {
            try {
                const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd,eur");
                const d = await r.json();
                setRealPrices({ solUsd: d.solana.usd, solEur: d.solana.eur, lastUpdate: new Date().toLocaleTimeString() });
            } catch (err) { addLog("Fallo CoinGecko (precio real SOL): " + err.message, "ERR"); }
        };

        const fetchReePrice = async () => {
            try {
                const now = new Date();
                const start = new Date(now.getTime() - 6 * 3600 * 1000);
                const fmt = (dt) => dt.toISOString().slice(0, 16);
                const url = `https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=${fmt(start)}&end_date=${fmt(now)}&time_trunc=hour`;
                const r = await fetch(url);
                if (!r.ok) throw new Error("HTTP " + r.status);
                const d = await r.json();
                const series = d?.included?.[0]?.attributes?.values || [];
                const last = series[series.length - 1];
                if (last) setReeReal({ price: +last.value.toFixed(2), lastUpdate: new Date(last.datetime).toLocaleString(), error: null });
            } catch (err) {
                setReeReal(p => ({ ...p, error: "Sin respuesta de REData" }));
                addLog("Fallo REData (precio real OMIE/REE): " + err.message, "ERR");
            }
        };

        // Solo Solflare: devuelve el proveedor inyectado por la extensión/app.
        const getWalletProvider = () => (window.solflare && window.solflare.isSolflare ? window.solflare : null);

        const connectWallet = async () => {
            const provider = getWalletProvider();
            if (!provider) {
                speakAI("Solflare no detectada. Instálala en solflare.com para conectar saldo real.");
                return;
            }
            setPhantom(p => ({ ...p, connecting: true }));
            try {
                const resp = await provider.connect();
                const pubkey = (resp?.publicKey || provider.publicKey).toString();
                const connection = new solanaWeb3.Connection(RPC_ENDPOINT);
                const lamports = await connection.getBalance(new solanaWeb3.PublicKey(pubkey));
                setPhantom({ connected: true, pubkey, solBalance: lamports / 1e9, connecting: false, provider: 'solflare' });
                speakAI(`Wallet real conectada (Solflare): ${pubkey.slice(0, 4)}...${pubkey.slice(-4)}. Saldo verificado on-chain.`);
                addLog(`Wallet Solflare conectada: ${pubkey}`, "WALLET");
            } catch (err) {
                speakAI("Conexión de wallet rechazada o fallida.");
                setPhantom(p => ({ ...p, connecting: false }));
            }
        };

        const refreshWalletBalance = async () => {
            if (!phantom.connected) return;
            try {
                const connection = new solanaWeb3.Connection(RPC_ENDPOINT);
                const lamports = await connection.getBalance(new solanaWeb3.PublicKey(phantom.pubkey));
                setPhantom(p => ({ ...p, solBalance: lamports / 1e9 }));
            } catch (err) { addLog("Fallo al refrescar saldo real: " + err.message, "ERR"); }
        };

        const getJupiterQuote = async (amountSol) => {
            try {
                const lamports = Math.floor(amountSol * 1e9);
                const url = `https://quote-api.jup.ag/v6/quote?inputMint=${SOL_MINT}&outputMint=${USDC_MINT}&amount=${lamports}&slippageBps=50`;
                const r = await fetch(url);
                const d = await r.json();
                setJupQuote(d);
                return d;
            } catch (err) { addLog("Fallo cotización Jupiter: " + err.message, "ERR"); return null; }
        };

        const executeRealJupiterSwap = async () => {
            if (!phantom.connected) { speakAI("Conecta tu wallet Solflare real primero."); return; }
            if (!phantom.solBalance || phantom.solBalance < 1.01) { speakAI("Saldo real insuficiente (necesitas >1 SOL para cubrir el swap y comisiones)."); return; }
            setSwapStatus("Cotizando en Jupiter...");
            const quote = await getJupiterQuote(1);
            if (!quote || quote.error) { setSwapStatus("Error de cotización"); return; }
            setSwapStatus("Esperando tu firma en Solflare...");
            try {
                const swapRes = await fetch("https://quote-api.jup.ag/v6/swap", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },

                                                    <input value={offerForm.kwhAvailable} onChange={e => setOfferForm(f => ({ ...f, kwhAvailable: e.target.value }))} type="number" step="0.01" placeholder="kWh disponibles" className="bg-black/50 border border-white/10 p-2 text-[9px] font-mono text-white" required />

                                                </div>

                                            </div>
                                        </div>

                                        <div className="rack-unit p-6 border-l-4 border-pacto">
                                            <h3 className="text-white font-black text-[10px] uppercase mb-2">Negociar Energía (IA ↔ Dispositivos/Agentes)</h3>
                                            <p className="text-[8px] text-white/40 mb-4 leading-relaxed">Un agente comprador paga la tarifa fija de matching ($0.02 en SOL real, verificado on-chain) y recibe contrapartes reales — dispositivos con oferta abierta y agentes del directorio. El pago de la energía en sí va directo a la wallet del dueño, nunca pasa por nuestra bóveda.</p>
                                            <div className="space-y-2 mb-3">
                                                <input value={negotiateForm.agentId} onChange={e => setNegotiateForm(f => ({ ...f, agentId: e.target.value }))} placeholder="agentId comprador" className="w-full bg-black/50 border border-white/10 p-2 text-[9px] font-mono text-white outline-none focus:border-pacto" />

                                                    <select value={negotiateForm.intent} onChange={e => setNegotiateForm(f => ({ ...f, intent: e.target.value }))} className="bg-black/50 border border-white/10 p-2 text-[9px] text-white">

                                                        <option value="sell">Vender</option>
                                                    </select>
                                                    <input value={negotiateForm.kwh} onChange={e => setNegotiateForm(f => ({ ...f, kwh: e.target.value }))} type="number" step="0.01" placeholder="kWh deseados" className="bg-black/50 border border-white/10 p-2 text-[9px] font-mono text-white" />
                                                </div>
                                                <button onClick={runNegotiate} className="w-full bg-pacto text-black font-black text-[9px] py-2 uppercase hover:brightness-125 transition">Buscar Contraparte Real</button>
                                            </div>
                                            {negotiateResult && (
                                                <div className="font-mono text-[8px] bg-black/60 p-2 rounded border border-white/5 max-h-32 overflow-y-auto">
                                                    {negotiateResult.error ? <p className="text-crisis">{negotiateResult.error}</p> : (
                                                        <>
                                                            <p className="text-white/40">Precio ref. REE: {negotiateResult.referencePriceEurMwh ?? '—'} €/MWh</p>

                                                                <p key={o.deviceId} className="text-aeth">{o.label}: {o.kwhSugerido} kWh · ${o.pricePerKwhUsd}/kWh → wallet {o.payToAddress?.slice(0,6)}...</p>
                                                            ))}
                                                            {(negotiateResult.posiblesContrapartes || []).map(c => (
                                                                <p key={c.agentId} className="text-glw">{c.agentId}: {c.serviceUrl}</p>
                                                            ))}

                                        </div>
                                    </div>
                                    
                                    <div className="lg:col-span-2 flex flex-col gap-6">
                                        <div className="rack-unit p-6 border-t-2 border-glw flex flex-col flex-grow">

                                                    <p className="text-[8px] text-white/40 uppercase mb-1">Potencia (PZEM)</p>

                                                </div>

                                                    <p className="text-[8px] text-white/40 uppercase mb-1">IA Precio Objetivo</p>

                                                </div>
                                                <div className="bg-black/40 p-4 rounded border border-white/5">
                                                    <p className="text-[8px] text-white/40 uppercase mb-1">Enclaves Activos</p>

                                                </div>
                                            </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: SINDICATO IA (SUBASTA HOLANDESA) */}
                        {tab === 'syndicate' && (
                            <div className="p-6 h-full flex flex-col gap-6">
                                <h2 className="text-white font-black text-2xl uppercase italic border-b border-white/10 pb-4">Sindicato Global de Agentes M2M</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow overflow-hidden">

                                                        <span className="text-white/30 shrink-0">[{c.time}]</span>
                                                        <span className={`${c.color} font-bold shrink-0 w-24`}>{c.agent}:</span>
                                                        <span className="text-white/80">"{c.msg}"</span>
                                                    </div>

                                            </div>
                                        </div>
                                    </div>

                                        <div className="rack-unit p-8 flex flex-col items-center justify-center border-t-4 border-aeth text-center h-1/2">

                                        </div>
                                        <div className="rack-unit p-6 h-1/2 flex flex-col">
                                            <p className="text-white font-black text-[10px] uppercase border-b border-white/10 pb-2 mb-4">Agentes Sindicato</p>

                                                <li className="flex justify-between text-tax border-b border-white/5 pb-2"><span>Boot-Fiscal</span><span className="text-glw">AUDITING</span></li>
                                                <li className="flex justify-between text-arctic border-b border-white/5 pb-2"><span>Boot-Sat-Sync</span><span className="text-glw">ORBITAL OK</span></li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: MATRIZ EMS V14000.0 */}
                        {tab === 'ems' && (
                            <div className="p-8 space-y-8 overflow-y-auto h-full">
                                <div className="flex justify-between items-center border-b border-white/10 pb-4">

                                    <span className="text-[8px] bg-crisis/20 text-crisis border border-crisis/30 px-3 py-1 rounded font-bold uppercase">EMERGENCY PROTOCOLS READY</span>

                                        { t: 'Iones Negativos', i: 'fa-atom', c: 'text-cyan-400' },
                                        { t: 'Infrarroja Térmica', i: 'fa-fire', c: 'text-red-400' },
                                        { t: 'Solar IA Optimizer', i: 'fa-sun', c: 'text-yellow-400' },

                                            <i className={`fas ${dev.i} text-3xl ${dev.c}`}></i>
                                            <span className="text-[9px] font-black uppercase text-white">{dev.t}</span>
                                            <span className="text-[7px] bg-white/10 px-3 py-1 rounded text-white/50 hover:bg-aeth hover:text-black font-bold transition">FORCE INJECT</span>

                                <div className="rack-unit p-6 bg-black/40 border-l-4 border-glw">
                                    <p className="text-white/60 font-mono text-[10px] leading-relaxed">
                                        <i className="fas fa-info-circle text-glw mr-2"></i> La Matriz Multimodal permite forzar la inyección de fuentes regenerativas a la red. El Sindicato liquidará automáticamente estas inyecciones de emergencia y recaudará la compensación en la Bóveda de Euro Digital.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: GOBERNANZA & 5 PILARES */}
                        {tab === 'governance' && (
                            <div className="p-8 h-full overflow-y-auto">
                                <div className="flex justify-between items-end border-b border-white/10 pb-6 mb-8">
                                    <div>
                                        <h2 className="text-white font-black text-2xl uppercase italic tracking-widest">Gobernanza V10000.0</h2>

                                    </div>
                                    <div className="bg-tax/10 border border-tax/30 px-5 py-3 rounded text-right">
                                        <p className="text-[8px] text-tax font-black uppercase">Algoritmo Fiscal Hardcoded</p>
                                        <p className="text-white font-mono text-lg mt-1">+5% Tax Transversal</p>

                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                    {[
                                        { n: "Mantenimiento", d: "Fondos Operativos", i: "fa-gears", c: "text-white" },

                                        { n: "Reserva", d: "Capital EURD & GLW", i: "fa-vault", c: "text-eurd" },
                                        { n: "I+D", d: "Autoregeneración IA", i: "fa-brain", c: "text-sol" },

                                            <p className="text-[8px] text-white/40 font-bold mb-2 uppercase">{code} · {name}</p>
                                            <p className="text-xl font-black text-white">€{wallet.pgc[code].toLocaleString(L.locale, { minimumFractionDigits: 2 })}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: QUANTUM AGENT */}

                                    {chatHistory.map((m, i) => (

                                            <p className="text-[7px] uppercase opacity-40 mb-1">{m.s === 'ai' ? 'Archon IA' : 'Operador'}</p>

                                <form onSubmit={handleQuantumQuery} className="flex gap-2">

                                    <button type="submit" className="btn-action">Auditar</button>
                                </form>
                            </div>
                        )}

                        {/* TAB: FACTURACIÓN HUB */}
                        {tab === 'billing' && (
                            <div className="h-full flex flex-col p-6">

                                </div>
                                <div className="flex-grow rack-unit overflow-auto border border-white/5">
                                    <table className="w-full text-[9px] font-mono text-left">
                                        <thead className="bg-black sticky top-0 text-white/30 uppercase border-b border-white/10">
                                            <tr><th className="p-4">ID</th><th className="p-4">Cliente</th><th className="p-4 text-white">Total con {L.taxLabel}</th><th className="p-4">Acción</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {invoices.map(inv => (
                                                <tr key={inv.id} className="hover:bg-white/5">
                                                    <td className="p-4 text-aeth font-bold">{inv.id}</td>
                                                    <td className="p-4 uppercase">{inv.client}</td>
                                                    <td className="p-4 text-white font-black">€{inv.total.toFixed(2)}</td>
                                                    <td className="p-4"><button onClick={() => setSelectedInvoice(inv)} className="bg-white text-black px-4 py-1 font-black uppercase text-[7px]">Ver Documento</button></td>
                                                </tr>
                                            ))}
                                            {invoices.length === 0 && <tr><td colSpan="4" className="p-10 text-center text-white/30 italic text-[10px]">Sin facturas aún. Genera una desde Green Impact.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB: MERCADO DE DATOS ENERGÉTICOS */}
                        {tab === 'datamarket' && (
                            <div className="h-full overflow-y-auto p-8">
                                <div className="flex gap-3 items-center mb-6 rack-unit p-4">
                                    <input value={backendUrl} onChange={e => saveBackendUrl(e.target.value)} placeholder="URL de tu backend real" className="flex-grow bg-black border border-white/10 p-2 text-[9px] text-white rounded outline-none focus:border-glw" />
                                    <button onClick={fetchCatalog} className="btn-action text-[8px] px-3 py-2">Cargar catálogo</button>
                                </div>
                                <h3 className="text-white font-black uppercase text-sm mb-2 italic">Lo que vendes: datos, no electricidad</h3>
                                <p className="text-[9px] text-white/40 mb-6 max-w-2xl leading-relaxed">Un agente de IA no puede consumir tu electricidad — corre en un servidor sin conexión física a tu medidor. Lo que sí compra es información verificada sobre ella. Cada producto acepta pago en USDC o en tus propios créditos de energía (mismo token del minteo de impacto).</p>
                                {catalog.length === 0 && <p className="text-white/20 italic text-[10px] mb-10">Carga el catálogo desde tu backend para verlo aquí.</p>}
                                {[
                                    { key: 'datos', label: 'Datos (un agente te paga por consumir información)' },
                                    { key: 'confianza', label: 'Confianza (notaría/auditoría entre agentes)' },
                                    { key: 'mercado', label: 'Mercado M2M (directorio y matching — tarifa fija, nunca % de lo que transen)' },
                                ].map(group => {
                                    const items = catalog.filter(i => i.category === group.key);

                                        <div key={group.key} className="mb-8">

                                                        <p className="text-[8px] text-white/40 mt-1">pagado en SOL real, verificado on-chain</p>
                                                        <p className="text-[7px] text-white/20 mt-3 font-mono break-all">{item.route}</p>

                                        </div>
                                    );

                                <div className="rack-unit p-8 border-l-4 border-arctic mb-8">
                                    <h3 className="text-white font-black uppercase text-sm mb-2 italic">Huella IA — la energía de las propias máquinas</h3>
                                    <p className="text-[9px] text-white/40 mb-4 max-w-2xl leading-relaxed">Un agente paga por un recibo firmado con la energía (Wh) y el CO2 estimados de una carga de trabajo de IA. Los coeficientes son referenciales y los créditos retirados son tuyos, no bonos de carbono certificados.</p>
                                    <button onClick={fetchFootprintStats} className="btn-action text-[8px] px-3 py-2 mb-4">Actualizar estadísticas</button>
                                    {footprintStats && (
                                        <div className="grid grid-cols-4 gap-3 text-center">
                                            <div className="bg-black/40 p-3 rounded"><p className="text-[7px] text-white/40 uppercase">Recibos</p><p className="text-lg font-black text-white">{footprintStats.recibos}</p></div>
                                            <div className="bg-black/40 p-3 rounded"><p className="text-[7px] text-white/40 uppercase">Wh totales</p><p className="text-lg font-black text-white">{footprintStats.totalWh}</p></div>
                                            <div className="bg-black/40 p-3 rounded"><p className="text-[7px] text-white/40 uppercase">kgCO2</p><p className="text-lg font-black text-arctic">{footprintStats.totalKgCO2}</p></div>
                                            <div className="bg-black/40 p-3 rounded"><p className="text-[7px] text-white/40 uppercase">Créditos retirados</p><p className="text-lg font-black text-glw">{footprintStats.creditosRetirados}</p></div>
                                        </div>
                                    )}
                                </div>

                                <div className="rack-unit p-8 border-l-4 border-sol">
                                    <h3 className="text-white font-black uppercase text-sm mb-2 italic">Calculadora AGPE (informativa, no ejecuta ninguna venta)</h3>
                                    <p className="text-[9px] text-white/40 mb-4 max-w-2xl leading-relaxed">Si tienes excedente real de energía, la venta física la liquida tu operador de red bajo el esquema de Autogenerador a Pequeña Escala (CREG 174 de 2021) — no esta página. Esto solo te da una referencia de orden de magnitud.</p>
                                    <div className="flex gap-4 items-center">
                                        <input type="number" value={agpeKwh} onChange={e => setAgpeKwh(parseFloat(e.target.value) || 0)} className="bg-black border border-white/10 p-2 text-[10px] text-white rounded w-32" />
                                        <span className="text-white/40 text-[9px]">kWh de excedente inyectado</span>
                                    </div>
                                    <p className="text-lg font-black text-sol mt-4">≈ €{((agpeKwh * (reeReal.price || 145)) / 1000).toFixed(2)} <span className="text-[8px] text-white/30">al precio de mercado actual — tu liquidación real puede variar según el operador y la metodología vigente (Mc)</span></p>
                                </div>
                            </div>
                        )}

                        {/* TAB: MERCADO DE PREDICCIÓN ENERGÉTICA */}
                        {tab === 'prediction' && (
                            <div className="h-full overflow-y-auto p-8">
                                <div className="flex gap-3 items-center mb-6 rack-unit p-4">
                                    <input value={backendUrl} onChange={e => saveBackendUrl(e.target.value)} placeholder="URL de tu backend real" className="flex-grow bg-black border border-white/10 p-2 text-[9px] text-white rounded outline-none focus:border-glw" />
                                    <button onClick={fetchPredictionStatus} className="btn-action text-[8px] px-3 py-2">Actualizar mercado</button>
                                </div>
                                <h3 className="text-white font-black uppercase text-sm mb-2 italic">Se resuelve solo, sin árbitro humano</h3>
                                <p className="text-[9px] text-white/40 mb-8 max-w-2xl leading-relaxed">Cada hora es un mercado nuevo: los agentes apuestan si el precio REE subirá o bajará frente al valor con el que abrió la hora. Al cerrar, se compara contra el precio real y los ganadores se reparten el fondo automáticamente en su wallet — menos una comisión del 5% para la plataforma. Nadie decide el resultado, lo decide el dato.</p>

                                {predictionStatus.open && (
                                    <div className="rack-unit p-8 border-l-4 border-glw mb-8">
                                        <p className="text-[8px] text-white/40 uppercase mb-2">Mercado abierto — hora {predictionStatus.open.hour}</p>
                                        <p className="text-[10px] text-white/60 mb-6">Precio de referencia: <span className="text-glw font-black">€{predictionStatus.open.baselinePrice}/MWh</span></p>
                                        <div className="grid grid-cols-2 gap-4">
                                            <button onClick={() => stakePrediction('yes')} className="btn-action bg-glw text-black py-5 font-black text-sm">SUBE ({predictionStatus.open.yes} apuestas)</button>
                                            <button onClick={() => stakePrediction('no')} className="btn-action bg-crisis text-white py-5 font-black text-sm">BAJA/IGUAL ({predictionStatus.open.no} apuestas)</button>
                                        </div>
                                        <p className="text-[7px] text-white/20 mt-4 uppercase">Prima por apuesta: $0.05 (USDC o créditos de energía)</p>
                                    </div>
                                )}
                                {backendMsg && <p className="text-[9px] text-glw font-mono mb-6 break-all">{backendMsg}</p>}

                                <h3 className="text-white font-black uppercase text-[10px] mb-3">Mercados resueltos recientes</h3>
                                <div className="rack-unit divide-y divide-white/5 font-mono text-[8px]">
                                    {predictionStatus.recent.map((m, i) => (
                                        <div key={i} className="p-3 flex justify-between">
                                            <span>{m.hour}h · €{m.baselinePrice} → €{m.resolvedPrice}</span>
                                            <span className={m.outcome === 'yes' ? 'text-glw' : 'text-crisis'}>{m.outcome === 'yes' ? 'SUBIÓ' : 'BAJÓ'} · {m.ganadores} ganador(es) · ${m.perWinnerUsd} c/u</span>
                                        </div>
                                    ))}
                                    {predictionStatus.recent.length === 0 && <p className="text-white/20 italic p-3">Aún no hay mercados resueltos.</p>}
                                </div>
                            </div>
                        )}

                        {/* TAB: GREEN IMPACT */}
                        {tab === 'green' && (
                            <div className="h-full overflow-y-auto p-8">
                                <div className="flex gap-3 items-center mb-6 rack-unit p-4">
                                    <input value={backendUrl} onChange={e => saveBackendUrl(e.target.value)} placeholder="URL de tu backend real (ej. https://api.tudominio.com)" className="flex-grow bg-black border border-white/10 p-2 text-[9px] text-white rounded outline-none focus:border-glw" />
                                    <button onClick={fetchImpactLog} className="btn-action text-[8px] px-3 py-2">Sincronizar</button>
                                </div>
                                <div className="grid grid-cols-2 gap-8 items-center mb-8">
                                    <div className="rack-unit p-10 border-l-4 border-arctic bg-arctic/5 text-center">
                                        <i className="fas fa-snowflake text-6xl text-arctic mb-8"></i>
                                        <h3 className="text-white font-black text-2xl uppercase mb-4 italic">"Luz Persistente"</h3>
                                        <p className="text-[10px] text-white/50 mb-10 leading-relaxed">Impacto Ártico: cada venta financia directamente la preservación de glaciares.</p>
                                        <button onClick={() => sellWithInvoice(20.00, 'Venta Obra "Luz Persistente" (ESG)', 'LIBRERIA-AETH')} className="btn-action bg-arctic text-black w-full py-5 font-black text-sm">Vender Ejemplar (€20.00)</button>
                                    </div>
                                    <div className="space-y-6">
                                        <div className="rack-unit p-8 border-l-4 border-glw"><p className="text-white/40 uppercase text-[9px] mb-2 font-bold">Obras Distribuidas</p><p className="text-5xl font-black text-glw font-mono">{wallet.books}</p></div>
                                        <div className="rack-unit p-8 border-l-4 border-arctic"><p className="text-white/40 uppercase text-[9px] mb-2 font-bold">Fondo Pacto Ártico</p><p className="text-5xl font-black text-arctic font-mono">€{wallet.arctic_fund.toLocaleString(L.locale)}</p></div>
                                    </div>
                                </div>

                                <div className="rack-unit p-8 border-l-4 border-glw">
                                    <h3 className="text-white font-black uppercase text-sm mb-2 italic">Tokenización Real de Impacto (PIVTAN)</h3>
                                    <p className="text-[9px] text-white/40 mb-6 leading-relaxed">Convierte una lectura del sensor DePIN en créditos SPL reales, acuñados on-chain al instante — sin auditor humano. Requiere tu backend real conectado y wallet Solflare activa.</p>
                                    <button onClick={mintRealImpact} className="btn-action bg-glw text-black px-6 py-3 font-black text-[10px] mb-4">ACUÑAR CRÉDITO REAL AHORA</button>
                                    {backendMsg && <p className="text-[9px] text-glw font-mono mb-4 break-all">{backendMsg}</p>}
                                    <div className="max-h-40 overflow-y-auto font-mono text-[8px] divide-y divide-white/5">
                                        {impactLog.map((i, idx) => (
                                            <div key={idx} className="py-2 flex justify-between"><span>{i.deviceId} · {i.co2AvoidedKg}kg CO2</span><span className="text-glw">{i.credits} créditos {i.mintTx ? '✔' : '(pendiente mint)'}</span></div>
                                        ))}
                                        {impactLog.length === 0 && <p className="text-white/20 italic py-2">Sin registros aún.</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: LEDGER DUAL (PGC/PUC) */}
                        {tab === 'ledger' && (
                            <div className="p-6 flex flex-col h-full">
                                <div className="flex justify-between items-center border-b border-white/10 pb-4 mb-6">
                                    <div>
                                        <h2 className="text-white font-black text-2xl uppercase italic">Libro Mayor Dual Transversal</h2>
                                        <p className="text-white/50 text-[10px] font-mono mt-1">Doble Contabilidad PGC (ES) y PUC (CO) + Liquidación M2M</p>
                                    </div>
                                    <button onClick={exportToExcel} className="btn-action bg-white text-black hover:bg-aeth text-[9px]">
                                        <i className="fas fa-file-excel mr-2"></i>Exportar Excel (XLSX)
                                    </button>
                                </div>
                                <div className="flex-grow rack-unit overflow-y-auto border border-white/5">
                                    <table className="w-full text-left font-mono text-[9px]">
                                        <thead className="sticky top-0 bg-black/90 text-white/40 uppercase border-b border-white/10 shadow-md">
                                            <tr>
                                                <th className="p-4">Cifrado Hash</th>
                                                <th className="p-4">Ruta Op.</th>
                                                <th className="p-4">Descripción Autónoma</th>
                                                <th className="p-4">PGC / PUC</th>
                                                <th className="p-4 text-tax">Tax 5%</th>
                                                <th className="p-4 text-glw">Neto EURD</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/5">
                                            {ledger.map((l, i) => (
                                                <tr key={i} className="hover:bg-white/5 text-white/80 transition">
                                                    <td className="p-4 text-sol font-bold">{l.hash}</td>
                                                    <td className="p-4"><span className="bg-white/10 px-2 py-1 rounded text-[8px]">{l.route}</span></td>
                                                    <td className="p-4 italic text-white/60">{l.desc}</td>
                                                    <td className="p-4 text-white/40">{l.pgc} / {l.puc}</td>
                                                    <td className="p-4 text-tax font-bold">-€{l.tax}</td>
                                                    <td className="p-4 text-glw font-black">€{l.net}</td>
                                                </tr>
                                            ))}
                                            {ledger.length === 0 && <tr><td colSpan="6" className="p-10 text-center text-white/30 italic text-[10px]">Esperando operaciones autónomas en la Blockchain...</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: VAULT JUPITER V6 */}
                        {tab === 'vault' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 h-full p-4">
                                <div className="rack-unit p-10 border-l-4 border-eurd flex flex-col justify-center">
                                    <h3 className="text-white font-black text-xl mb-10 uppercase tracking-widest italic border-b border-white/10 pb-4">Bóveda Soberana (Mainnet)</h3>
                                    <div className="space-y-6">
                                        <div className="bg-black/60 p-6 border border-white/10 rounded">
                                            <p className="text-[8px] text-white/40 uppercase font-bold mb-2">Reserva Euro Digital (MiCA)</p>
                                            <p className="text-5xl font-black text-white">€{wallet.eurd.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-black/60 p-5 border border-sol/30 rounded text-center">
                                                <p className="text-[8px] text-sol font-bold uppercase mb-2">Liquidez Solana {phantom.connected ? '(real)' : '(demo)'}</p>
                                                <p className="text-2xl font-black text-white">{phantom.connected ? phantom.solBalance.toFixed(3) : wallet.sol.toFixed(2)} <span className="text-[10px]">SOL</span></p>
                                                <p className="text-[7px] text-white/30 mt-1">1 SOL ≈ €{realPrices.solEur ?? '—'} / ${realPrices.solUsd ?? '—'}</p>
                                            </div>
                                            <div className="bg-black/60 p-5 border border-glw/30 rounded text-center">
                                                <p className="text-[8px] text-glw font-bold uppercase mb-2">Green Assets (demo)</p>
                                                <p className="text-2xl font-black text-white">{wallet.glw} <span className="text-[10px]">GLW</span></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="glass-panel p-10 flex flex-col justify-center items-center text-center">
                                    <h3 className="text-white font-black text-2xl mb-4 uppercase italic tracking-widest">Jupiter V6 Protocol</h3>

                                    {!phantom.connected && (
                                        <div className="w-full bg-black/60 p-6 rounded-lg border border-sol/20 mb-6">
                                            <p className="text-white/60 text-[10px] mb-4">Conecta tu Solflare para cotizar y ejecutar un swap real en Solana mainnet.</p>
                                            <button onClick={connectWallet} className="btn-action bg-orange-500 text-white px-6 py-3 text-[10px]">{phantom.connecting ? 'CONECTANDO...' : 'CONECTAR SOLFLARE'}</button>
                                        </div>
                                    )}

                                    {phantom.connected && (
                                        <div className="w-full bg-black/60 p-8 rounded-lg border border-glw/30 flex justify-between items-center mb-6 shadow-inner">
                                            <div><p className="text-[9px] text-white/40 mb-2">PAGAR</p><p className="text-2xl font-black text-sol">1.00 SOL</p></div>
                                            <i className="fas fa-arrow-right text-white/30 text-2xl"></i>
                                            <div><p className="text-[9px] text-white/40 mb-2">RECIBIR (est.)</p><p className="text-2xl font-black text-white">{jupQuote ? (jupQuote.outAmount/1e6).toFixed(2) : (realPrices.solUsd ?? '—')} USDC</p></div>
                                        </div>
                                    )}
                                    {phantom.connected && (
                                        <>
                                            <button onClick={executeRealJupiterSwap} className="btn-action bg-glw text-black w-full py-5 font-black text-sm tracking-widest">EJECUTAR SWAP REAL (ON-CHAIN)</button>
                                            {swapStatus && <p className="text-[9px] text-glw mt-3 font-mono break-all px-4">{swapStatus}</p>}
                                            <p className="text-[8px] text-crisis mt-4 uppercase tracking-wide">⚠ Transacción real e irreversible en Solana mainnet. Verifica el monto antes de firmar.</p>
                                        </>
                                    )}

                                    <div className="w-full border-t border-white/10 mt-8 pt-6">
                                        <p className="text-[8px] text-white/30 uppercase mb-3">Modo demo (sin conexión, no mueve fondos reales)</p>
                                        <button onClick={executeJupiterSwap} className="btn-action bg-white/10 text-white/60 w-full py-4 font-black text-[10px] tracking-widest">SIMULAR FLASH-SWAP (DEMO)</button>
                                    </div>
                                    <p className="text-[8px] text-white/30 mt-6 uppercase tracking-[0.2em]">Ruta Optimizada: SOL → USDC | Jupiter v6 | Slippage 0.5%</p>
                                </div>

                                <div className="glass-panel p-8 col-span-2 mt-4">
                                    <h3 className="text-white font-black text-lg uppercase italic mb-2">Seguro Mutuo Autónomo Entre Agentes</h3>
                                    <p className="text-[9px] text-white/40 mb-6 max-w-2xl">Fondo real alimentado por micro-primas en SOL. Un reclamo solo se paga si el hash de la transacción disputada NO existe on-chain — verificación automática, no un juicio de IA.</p>
                                    <div className="grid grid-cols-3 gap-4 mb-6">
                                        <div className="rack-unit p-4 border-l-4 border-sol text-center"><p className="text-[8px] text-white/40 uppercase">Fondo</p><p className="text-2xl font-black text-sol">${insurance.poolUsd?.toFixed(2) ?? '0.00'}</p></div>
                                        <div className="rack-unit p-4 border-l-4 border-white/10 text-center"><p className="text-[8px] text-white/40 uppercase">Reclamos</p><p className="text-2xl font-black text-white">{insurance.totalClaims ?? 0}</p></div>
                                        <div className="rack-unit p-4 border-l-4 border-glw text-center"><p className="text-[8px] text-white/40 uppercase">Pagados</p><p className="text-2xl font-black text-glw">{insurance.pagados ?? 0}</p></div>
                                    </div>
                                    <button onClick={fetchInsuranceStatus} className="btn-action text-[8px] px-4 py-2 mb-6">Actualizar estado del fondo</button>
                                    <div className="grid grid-cols-2 gap-3">
                                        <input value={claimForm.claimantAgentId} onChange={e => setClaimForm(f => ({ ...f, claimantAgentId: e.target.value }))} placeholder="Tu Agent ID" className="bg-black border border-white/10 p-2 text-[9px] text-white rounded" />
                                        <input value={claimForm.claimantPayoutAddress} onChange={e => setClaimForm(f => ({ ...f, claimantPayoutAddress: e.target.value }))} placeholder="Tu wallet Solana de pago" className="bg-black border border-white/10 p-2 text-[9px] text-white rounded" />
                                        <input value={claimForm.disputedTxHash} onChange={e => setClaimForm(f => ({ ...f, disputedTxHash: e.target.value }))} placeholder="Hash de la tx disputada" className="bg-black border border-white/10 p-2 text-[9px] text-white rounded col-span-2" />
                                        <input type="number" value={claimForm.expectedAmountUsd} onChange={e => setClaimForm(f => ({ ...f, expectedAmountUsd: parseFloat(e.target.value) || 0 }))} placeholder="Monto esperado USD" className="bg-black border border-white/10 p-2 text-[9px] text-white rounded col-span-2" />
                                    </div>
                                    <button onClick={submitClaim} className="btn-action bg-crisis/80 text-white w-full py-3 mt-4 font-black text-[10px]">PRESENTAR RECLAMO (VERIFICACIÓN AUTOMÁTICA)</button>
                                    {backendMsg && <p className="text-[9px] text-glw font-mono mt-3 break-all">{backendMsg}</p>}
                                </div>
                            </div>
                        )}
                        
                    </main>
                </div>

                {/* FOOTER: GHOST PROTOCOL STATUS */}
                <footer className="glass-rack px-6 py-3 flex justify-between items-center text-[8px] font-bold uppercase tracking-[0.3em] mt-2 rounded">
                    <div className="flex gap-6 items-center text-white/40">
                        <span className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-glw animate-pulse"></div> Hardware Enclaves Linked</span>
                        <span className="text-white/10">|</span>
                        <span className="text-sol">Ghost Protocol: ENFORCED</span>
                        <span className="text-white/10">|</span>
                        <span className="text-tax">Tax Alg: LOCKED</span>
                    </div>
                    <div className="flex gap-4">
                        <span className="text-white/20 italic tracking-widest">{L.footer}</span>
                    </div>
                </footer>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
